# ============================================================================
# sources.yaml — the SHARED feed pool, the dials, and the terms notes.
#
# Feeds come from two places:
#
#   * topics.yaml — feeds NATIVE to one category. A single-subject publication,
#     whose every story belongs in that section. Those live next to the keywords
#     they belong with, because they answer the same question.
#   * this file, under `rss:` — the SHARED pool. Multi-subject publications
#     whose front page covers several configured categories and none exclusively.
#     Keywords decide where each of their stories lands, or whether it lands.
#
# The distinction is a claim about the PUBLICATION, not about its quality.
# TechCrunch appears in both: its AI section feed is native to AI in topics.yaml,
# and its front page is here, so a TechCrunch crypto or space story still
# reaches the right section by keyword.
#
# `weight` is the "premium" dial. 1.0 is neutral. Raise it for outlets you
# trust, lower it for ones you merely tolerate.
#
# ---------------------------------------------------------------------------
# ABOUT THIS FEED LIST, READ BEFORE ADDING TO IT
#
# Every feed in both files returned HTTP 200 with parseable XML when probed on
# 2026-08-28 from a residential connection. Reproduce it yourself any time:
#
#     python3 scripts/probe_sources.py
#
# "It returned 200" means the feed is REACHABLE. It does not mean you have
# permission to republish it. Those are different questions and only the first
# one is testable by a script.
#
# This list sticks to feeds publishers expose for reading and syndication.
# Publisher-specific terms still govern presentation and attribution. The BBC
# World feed is now included as a native World source; FT and NYT remain absent.
#
# DELIBERATELY ABSENT, and why (checked 2026-08-28):
#
#   FT, NYT          Published terms govern RSS reuse specifically.
#   Endpoints News   Feed returns HTTP 403 to an ordinary client. Not reachable,
#                    so the terms question never arose.
#   STAT News        Reachable, and its own terms of service could not be
#                    retrieved to check. Most feed items are also STAT+, so the
#                    link lands a reader on a paywall. Two reasons to leave out.
#   Nature, Science  Terms pages sit behind an authentication redirect and could
#                    not be read. Both are general-science publications rather
#                    than biotech ones, so the fit was weak anyway.
#   arXiv            Reachable and parses (312 entries on the day of probing).
#                    Left out on EDITORIAL grounds, not legal ones: it is a
#                    preprint firehose, not news, and several hundred same-day
#                    papers would crowd a recency-ranked AI section out of
#                    existence. Uncomment below if you want it.
#
# If you add a feed, you own that decision. This tool shows a headline, an
# attribution, a link out, and the preview image the publisher declared for that
# story, hotlinked from them. It never reproduces article text and never
# re-hosts an image, which is the ordinary reader-facing use of a feed. That is
# a reasonable position, not legal advice.
# ============================================================================

settings:
  # Shown in the browser tab and as the page heading.
  site_name: "News Curator"
  # Optional. Linked in the footer, and the source of the "Add a topic or
  # keyword" link. Falls back to the GitHub Actions repo, so a fork advertises
  # ITSELF rather than whoever it was forked from.
  # repo_url: "https://github.com/your-name/news-curator"

  # How far back an item can be published and still be considered.
  max_age_hours: 48
  # Source freshness is a separate warning threshold. Individual rows can
  # override it without changing the global 48-hour display window.
  default_source_max_age_hours: 48
  # A collected snapshot may cross job boundaries, but cannot be replayed into
  # a later hourly cycle. Two hours covers the bounded workflow jobs plus a
  # practical artifact handoff delay.
  source_snapshot_max_age_seconds: 7200
  # Per-request network timeout, seconds.
  request_timeout: 15
  # Global ceilings. A source row can choose smaller values, never larger.
  max_response_bytes: 8388608
  per_host_concurrency: 4
  # Max items shown per category on the rendered page.
  max_items_per_topic: 30
  # Feeds are fetched in parallel. The list is long enough that doing them one
  # at a time made the build slower than the news. Bounded on purpose: these are
  # other people's servers, and each feed is still hit exactly once per run.
  fetch_workers: 8
  user_agent: "news-curator/0.2 (+https://github.com/topics/news-curator)"

ranking:
  # Recency is the dominant term: the product promise is "up to date".
  recency_half_life_hours: 12.0
  weight_recency: 1.0
  weight_keyword: 0.6
  weight_source: 0.4
  # Bonus when 2+ DISTINCT platforms carried the same LINK. Fuzzy title matches
  # never feed this, so the "N sources" badge means what it says.
  weight_echo: 0.5
  echo_max_sources: 3
  # A keyword hit in the first N characters suggests the article is ABOUT the
  # topic rather than merely mentioning it.
  title_lead_chars: 40
  title_lead_bonus: 0.25
  # What a story from a category's OWN feed scores when no keyword hit. Zero
  # would be wrong twice over: the feed being single-subject is real evidence,
  # and a curated nuclear story would otherwise rank below a passing mention of
  # "power grid" in a story about something else.
  #
  # The exact value matters. A single keyword hit with no lead bonus scores
  # exactly 0.5, so 0.5 here would TIE with it and let source weight break the
  # tie. 0.4 keeps the order strict: a headline that says what it is about
  # outranks one that merely arrived on the right feed.
  native_source_score: 0.4

dedup:
  # Titles more similar than this (0-1) collapse into one row. Differing
  # numbers veto a merge, so "iOS 18.6.1" and "iOS 18.6.2" stay separate.
  # 0.90 rather than 0.85 because "Apple releases iOS 18.6.1" and "Apple
  # DELAYS iOS 18.6.1" score 0.875: opposite stories, identical numbers.
  title_similarity_threshold: 0.90
  # Only compare titles published within this many hours of each other.
  time_bucket_hours: 36

# ---------------------------------------------------------------------------
# Preview images. The publisher's own picture for their own story, hotlinked.
#
# Two sources, cheapest first. Roughly half the feeds above ship the image in
# the feed itself (media:content, media:thumbnail, an image enclosure), which
# costs nothing extra and is the only way to get a picture from publishers who
# refuse a direct article fetch. Only the rows still without one get their
# article HEAD read for an og:image tag, and only after ranking, so the ceiling
# is the number of VISIBLE rows rather than everything collected.
#
# Answers are cached in image_cache.json, committed to the repo, keyed by
# canonical URL. The answer for a given article does not change, the job runs
# every hour, and a committed file is both durable and auditable.
#
# Nothing is downloaded, resized or re-hosted. The publisher keeps their CDN,
# their referrer, and the ability to change or withdraw the image at any time.
# ---------------------------------------------------------------------------
images:
  enabled: true
  # 256 KB. A 64 KB cap silently missed every Springer article page, whose
  # </head> sits at about 100 KB.
  max_bytes: 262144
  timeout: 10
  # Two brakes, same reasoning as the Hacker News tier: the request cap bounds
  # volume, the time budget bounds the RUN, and the second is the one that
  # actually protects the job when a publisher is slow. Anything not resolved
  # this run is simply a cache miss next run.
  max_fetches_per_run: 120
  budget_seconds: 60
  workers: 8
  # Drop cache entries for links we have not seen in this many days, so the
  # committed file cannot grow without bound.
  retain_days: 45
  # "This page declares no image" is a permanent fact and is kept for the full
  # retention window. A refusal or a timeout is a fact about one moment, so it
  # is retried after this long rather than becoming permanent.
  retry_error_after_hours: 24

# ---------------------------------------------------------------------------
# Tier A — Hacker News via the Algolia API. No auth, no key, no quota observed
# across 10 rapid sequential calls (~0.3 s each) from a residential IP.
#
# HN is an AGGREGATOR: the headline is written by whoever submitted the link,
# not by the publisher. Rows sourced only from HN are labeled "via Hacker News",
# and when a publisher's own feed carried the same link, the publisher's
# headline wins. Its weight is below 1.0 for that reason.
#
# Which terms get searched comes from each category's `hn_queries` in
# topics.yaml. See the note at the bottom of that file for why that list is
# separate from the keyword list.
# ---------------------------------------------------------------------------
hackernews:
  type: hackernews
  id: hackernews
  name: Hacker News
  url: "https://hn.algolia.com/api/v1"
  enabled: true
  weight: 0.95
  # The ranked endpoint gives quality; this floor keeps out 1-point noise.
  min_points_ranked: 20
  # The by-date endpoint gives freshness and runs with no floor.
  include_by_date: true
  hits_per_page: 40
  # One additive request supplies the first-class Trending lane.
  front_page_hits_per_page: 30
  front_page_max_age_hours: 12
  front_page_category: trending
  # Two brakes. The request cap bounds volume; the time budget bounds the run,
  # which is what actually protects the CI job when the API is slow. Query plans
  # are interleaved across categories, so hitting the cap thins every section a
  # little rather than starving whichever ones are written last in the file.
  max_requests: 60
  budget_seconds: 120

# ---------------------------------------------------------------------------
# Tier B — the SHARED RSS pool. Multi-subject publications. Keywords decide
# where their stories land. Feeds native to ONE category live in topics.yaml.
#
# Mark a source `aggregator: true` if its titles are submitter-written.
# ---------------------------------------------------------------------------
rss:
  # Broad general-news sources. News sitemaps use the same bounded feed tier
  # and carry item-level publication dates, never sitemap lastmod values.
  - {id: cnn-news,   name: CNN,       url: "https://www.cnn.com/sitemap/news.xml",              type: news_sitemap, language: en, max_age_hours: 6, weight: 1.0}
  - {id: fox-news,   name: Fox News,  url: "https://www.foxnews.com/sitemap.xml?type=news",      type: news_sitemap, language: en, max_age_hours: 6, weight: 1.0}
  - {id: cbs-news,   name: CBS News,  url: "https://www.cbsnews.com/latest/rss/main",            language: en, max_age_hours: 6, weight: 1.0}
  - {id: yahoo-news, name: Yahoo News, url: "https://news.yahoo.com/rss/",                       language: en, max_age_hours: 6, weight: 0.95}

  # Chinese technology sources. Google News links stay on news.google.com;
  # without a documented decoder they are useful outbound paths but are never
  # counted as independent corroboration.
  - {id: cnbeta,      name: cnBeta,      url: "https://www.cnbeta.com.tw/backend.php", language: zh, max_age_hours: 6, weight: 0.95}
  - {id: solidot,     name: Solidot,     url: "https://www.solidot.org/index.rss",      language: zh, max_age_hours: 6, weight: 1.0}
  - {id: google-36kr, name: 36kr via Google News, url: "https://news.google.com/rss/search?q=site%3A36kr.com%20when%3A1d&hl=zh-CN&gl=CN&ceid=CN%3Azh-Hans", language: zh, max_age_hours: 12, weight: 0.9, aggregator: true, platform: google-news, echo_eligible: false}

  # General technology and business. Broad enough to feed every category.
  - {id: techcrunch,   name: TechCrunch,       url: "https://techcrunch.com/feed/",                weight: 1.0}
  - {id: verge,        name: The Verge,        url: "https://www.theverge.com/rss/index.xml",      weight: 1.0}
  - {id: arstechnica,  name: Ars Technica,     url: "https://arstechnica.com/feed/",               weight: 1.1}
  - {id: wired,        name: Wired,            url: "https://www.wired.com/feed/rss",              weight: 1.0}
  - {id: mittr,        name: MIT Tech Review,  url: "https://www.technologyreview.com/feed/",      weight: 1.1}
  - {id: theregister,  name: The Register,     url: "https://www.theregister.com/headlines.atom",  weight: 0.9}
  - {id: venturebeat,  name: VentureBeat,      url: "https://venturebeat.com/feed/",               weight: 0.9}
  - {id: restofworld,  name: Rest of World,    url: "https://restofworld.org/feed/latest/",        weight: 1.0}
  - {id: fourohfour,   name: 404 Media,        url: "https://www.404media.co/rss/",                weight: 1.0}
  - {id: stratechery,  name: Stratechery,      url: "https://stratechery.com/feed/",               weight: 1.0}
  - {id: simonw,       name: Simon Willison,   url: "https://simonwillison.net/atom/everything/",  weight: 1.05}

  # Engineering and science desks. Each covers several configured categories,
  # which is exactly why they are shared rather than native to one.
  - {id: ieee,         name: IEEE Spectrum,    url: "https://spectrum.ieee.org/feeds/feed.rss",    weight: 1.1}
  - {id: ieee-comp,    name: IEEE Spectrum Computing, url: "https://spectrum.ieee.org/feeds/topic/computing.rss", weight: 1.05}
  - {id: quanta,       name: Quanta Magazine,  url: "https://api.quantamagazine.org/feed/",        weight: 1.05}
  - {id: techxplore,   name: Tech Xplore,      url: "https://techxplore.com/rss-feed/",            weight: 0.85}
  # Quantum PHYSICS, not quantum computing. Shared, so keywords decide.
  - {id: physorg-q,    name: Phys.org Quantum, url: "https://phys.org/rss-feed/physics-news/quantum-physics/", weight: 0.95}
  - {id: googleai,     name: Google Blog,      url: "https://blog.google/technology/ai/rss/",      weight: 0.9}

  # Community aggregators: submitter-written titles, so flagged and down-weighted.
  - {id: lobsters,     name: Lobsters,         url: "https://lobste.rs/rss",                       weight: 0.9, aggregator: true}
  - {id: hnfront,      name: Hacker News,      url: "https://news.ycombinator.com/rss",            weight: 0.9, aggregator: true, platform: hackernews}

  # Reachable, parses, and deliberately off. A few hundred same-day preprints
  # would take most of a recency-ranked AI section. Uncomment if you want them.
  # - {id: arxivai,    name: arXiv cs.AI,      url: "https://export.arxiv.org/rss/cs.AI",          weight: 0.7}
  # - {id: arxivlg,    name: arXiv cs.LG,      url: "https://export.arxiv.org/rss/cs.LG",          weight: 0.7}

# ---------------------------------------------------------------------------
# Tier C — Reddit. OFF BY DEFAULT, and that is not an oversight.
#
# Measured 2026-08-25 from a residential IP:
#   /r/<sub>/hot.json      -> HTTP 403 with every User-Agent tried. Closed.
#   /r/<sub>/.rss, bursty  -> HTTP 200 once, then HTTP 429 for everything after
#   /r/<sub>/.rss, spaced  -> HTTP 200 every time, 10 entries each
#
# That last line matters: the 429 is a short-window BURST limit, not a ban.
# Four requests spaced 60-300 s apart all succeeded once the throttle cooled
# off. Reddit over RSS works if you go slow, and only if you go slow.
#
# Still off by default, for two honest reasons:
#   1. GitHub Actions runners use shared datacenter IPs, the traffic class
#      Reddit blocks hardest, and that cannot be tested from a laptop.
#   2. Reddit points programmatic users at registered OAuth apps. Unauthenticated
#      RSS polling is tolerated rather than sanctioned.
#
# Turning it on is harmless either way: a blocked tier is skipped with a note on
# the page, never a failed run. See README, "Reddit is hard".
# ---------------------------------------------------------------------------
reddit:
  enabled: false
  weight: 0.85
  # Seconds between subreddit requests. 6 s earned a 429; 60 s did not.
  # 30 s is the compromise, and the tier stops on the first 429 rather than
  # hammering. Do not lower this.
  request_delay_seconds: 30
  subreddits:
    - technology
    - programming
    - MachineLearning
    - artificial
    - LocalLLaMA

# ---------------------------------------------------------------------------
# Translation bridge. Backend contracts and budget controls are present, but
# the paid provider lane is dark until both this switch and the protected
# workflow switch are enabled after explicit approval.
# ---------------------------------------------------------------------------
translation:
  enabled: false
  provider: google
  targets: [en, zh]
  max_items_per_language: 25
  max_characters_per_language: 2000
  run_character_limit: 2000
  day_character_limit: 15000
  month_character_limit: 450000
  max_output_title_characters: 2000
  max_output_description_characters: 8000
  lease_timeout_seconds: 900
  sent_timeout_seconds: 900
  request_timeout_seconds: 20
  max_response_bytes: 524288
  per_host_concurrency: 2
  normalization_version: normalized-item-v1
  glossary_policy_version: none-v1
  candidate_policy_version: ranked-non-newsletter-v1
  # Resolved against project_id_env and location before use. The resulting
  # full resource is sent to Google and is the cache/provenance identity.
  model_version: projects/{project_id}/locations/{location}/models/general/nmt
  location: global
  project_id_env: GOOGLE_CLOUD_PROJECT_ID
  supabase_url_env: NEWS_CURATOR_SUPABASE_URL
  supabase_service_role_key_env: NEWS_CURATOR_SUPABASE_SERVICE_ROLE_KEY

# ---------------------------------------------------------------------------
# The newsletter lane. Reads a dedicated newsletter-only Gmail account through
# a separate, secrets-scoped Actions job and renders the stories as their own
# tab. Everything about the account (its address included) lives OUTSIDE this
# repository: the three OAuth values are GitHub Actions secrets, and the lane
# is dark for any fork that has not wired its own.
#
# `enabled: true` here is only half the switch. The lane also requires the
# three GMAIL_* secrets at runtime, so a fork with this file unchanged still
# builds a page with no newsletter tab, no extra dependency, and no failure.
#
# `adapters` names the per-sender allowlist (curator/newsletter/adapters.py).
# A sender without an adapter is counted and reported, never parsed blind.
# ---------------------------------------------------------------------------
newsletter:
  enabled: true
  adapters: [tldr, therundown, bensbites, theneuron, milkroad]
  max_items: 50        # the lane's own cap; category caps are untouched
  max_age_hours: 48    # same retention window as everything else
  max_messages: 30     # message BODIES read per hourly run, oldest first
  overlap_hours: 6     # poll window overlaps the committed watermark
  request_timeout: 20
  id_budget: 500       # message ids listed per run (pagination ceiling)
  # Which server's Authentication-Results header is trusted for the DKIM
  # check. Relayed mail legitimately carries other servers' headers, and an
  # attacker can write one, so only the receiving server's own verdict counts.
  authserv_id: mx.google.com
