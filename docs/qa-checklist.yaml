    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_personalization_auth.py tests/test_personalization_browser_contract.py tests/test_personalization_materializer.py"
    comparison_mode: "invalid/replayed state and wrong redirects fail; captured stdout/stderr/history contain no token or authorization code"
    side_effects: "Uses fake OAuth transport and local loopback only."
    current_status: PARTIAL
    blockers:
      - "The callback, CLI, and Node contract exist. A real local browser callback and token-expiry lifecycle has not been proven in this local-only run."
      - "Google provider activation is a separate cloud-linked gate."
