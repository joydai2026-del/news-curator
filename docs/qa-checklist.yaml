  - id: NCV3-12
    group: locally_provable
    description: Local Postgres concurrency tests prove atomic cache acquire/reservation, fixed counter order, idempotent lifecycle operations, failure classifications, quarantine, and no automatic retry after a charge-unknown outcome.
