cloud_linked_gates:
  - id: NCV3-CLOUD-01
    description: Supabase project is linked, Google Auth is enabled, exact authorized origins and redirects are configured, and the real cloud RLS contract passes.
    check_type: live_cloud_contract
    planned_command: "supabase link --project-ref <JJ-approved-project-ref> && supabase db push && uv run pytest -q tests/test_personalization_cloud.py"
    comparison_mode: "real anon and cross-user requests are denied; real owner authorization-code PKCE flow completes with approved redirects only"
    side_effects: "Mutates only a JJ-approved cloud Supabase project. Requires separate action-time authorization."
    current_status: PARTIAL
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers:
      - "Project linking, approved migrations, owner/cross-user API boundaries, and authenticated reading passed in production. This release used disposable admin-created sessions and did not exercise email-code delivery or the Google authorization-code flow."
  - id: NCV3-CLOUD-02
    description: Google Cloud Translation credentials, billing, origin-bound bearer authentication, rotation, revocation, and protected workflow environment are activated and verified.
    check_type: live_cloud_contract
    planned_command: "Run the approved translation-job activation checklist, then execute its protected main-only workflow on the reviewed main build."
    comparison_mode: "credential reaches only the protected translation job; one controlled request and persistence lifecycle receipt complete without secret leakage"
    side_effects: "May enable billing and make controlled paid provider requests. Requires separate action-time authorization."
    current_status: BLOCKED
    blockers:
      - "No Google Cloud Translation credential, project variable, or billing activation is currently present."
      - "JJ has not authorized credential, billing, secret, dispatch, or deployment actions."
  - id: NCV3-CLOUD-03
    description: The deployed Supabase schema enforces owner-only reading state and interest state, serves one latest published edition with all topics, and provides independent keyset pagination capped at 20 rows per topic.
    check_type: live_cloud_security_and_api_contract
    planned_command: "Run the cloud reading/history contract suite against the approved Supabase project using two real test users and a service-only setup identity."
    comparison_mode: "owner requests succeed; anonymous, expired-token, cross-user, altered-id, and direct-table requests fail; edition, topic, and pagination results match the approved contract"
    side_effects: "Creates and removes bounded test records in the approved cloud Supabase project. Run once after reviewed migration deployment."
    current_status: PARTIAL
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers:
      - "Production owner, cross-user, direct-table, pagination, CAS, and replay checks passed. Expired-token rejection was exercised on the local PostgREST stack, not by waiting for a production token to expire."
live_proven_gates:
  - id: NCV3-LIVE-01
    description: The protected scheduled translation path and public static page work on the same reviewed build. Public news remains readable without an account and falls back to originals under translation failure.
    check_type: production_path_run
    planned_command: "Run the approved main-only scheduled workflow, then inspect its deployed public page and dated workflow/source-health/translation receipts."
    comparison_mode: "scheduled build, sanitized artifact validation, static deployment, and public anonymous read succeed; injected or observed translation failure still serves originals"
    side_effects: "Dispatches workflow and may publish a production update. Requires separate action-time authorization."
    current_status: PARTIAL
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers:
      - "Approved production build, deploy, archive finalization, anonymous reading, and unattended hourly publication passed. Translation is intentionally disabled; translation activation and quality calibration are outside this reading-history release."
  - id: NCV3-LIVE-02
    description: "The reviewed production build passes a real desktop and mobile-width reading/history walkthrough: story, external, and settings-entry links open safely in a new tab, state persists after reload, topic pagination appends without duplicates or jumps, and a newer-edition banner appears without silent replacement."
    check_type: production_browser_run
    planned_command: "Run the approved production browser checklist at desktop and mobile viewport sizes against the deployed commit, recording build identity and screenshots without private account data."
    comparison_mode: "every named interaction passes on the same deployed build and no private identity, token, or state appears in the public artifact or receipt"
    side_effects: "Writes bounded state only to the authorized test user's read, saved, and interest rows."
    current_status: GREEN
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers: []
    note: "Final code passed desktop/phone persistence, filters, pagination, logout, and the real publication 5-to-6 banner transition. Topic/card geometry, scroll, order, and focus stayed unchanged until Tab/Enter explicitly loaded the new edition."
  - id: NCV3-LIVE-03
    description: The protected newsletter workflow verifies its bound Gmail profile before ingestion and publishes only a generic pass or fail receipt. No mailbox address, expected digest, OAuth token, or raw profile response is exposed.
    check_type: protected_workflow_identity_run
    planned_command: "Run the protected main-only newsletter job on the reviewed commit and inspect the redacted Actions log plus generated artifact leak scan."
    comparison_mode: "generic identity-verified receipt exists before ingestion; protected values are absent from logs and artifacts; mismatch path fails closed in a controlled rehearsal"
    side_effects: "Reads the configured mailbox profile and may perform normal bounded newsletter ingestion. It must not send email."
    current_status: GREEN
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers: []
    note: "The first protected run correctly refused a mailbox-profile mismatch. Corrected run 34225512477 passed the real profile guard and ingested newsletter items. The scheduled run 34227237811 also passed. Only aggregate receipts are retained."
  - id: NCV3-LIVE-04
    description: The first production archive contains up to five days of real successfully published editions that are actually available. Missing days stay missing and are never replaced with mock or inferred records.
    check_type: time_gated_production_data_check
    planned_command: "Query the production latest-edition and per-topic archive APIs after deployment, then compare every returned edition identity with a successful Pages deployment receipt."
    comparison_mode: "all returned records have matching successful deployment receipts, observed span is no greater than five days, and no synthetic records exist"
    side_effects: "Read-only production API and GitHub Actions receipt inspection."
    current_status: GREEN
    evidence: docs/evidence/2026-09-08-m1-release.md
    blockers: []
    note: "The first archive records 137 real stories from its successful Pages run. No older archive was available to backfill; missing days remain absent."
  - id: NCV3-LIVE-05
    description: Production proves retrieval of at least one real successfully published edition older than five days while retaining no edition older than the rolling 30-day boundary.
    check_type: time_gated_production_data_check
    planned_command: "After enough successful daily publications accumulate, query the production archive across the five-day and 30-day boundaries and reconcile returned edition identities to Pages deployment receipts."
    comparison_mode: "at least one receipt-backed edition older than five days is retrievable and every returned edition falls within the rolling 30-day boundary"
    side_effects: "Read-only production API and GitHub Actions receipt inspection."
    current_status: BLOCKED
    blockers:
      - "This requires more than five days of real successfully published edition history after archive deployment. Time cannot be replaced with fixtures for a live-proven gate."
  - id: NCV3-LIVE-06
    description: Production proves the full rolling 30-day retention window using only real successfully published editions, with boundary-day inclusion and older-record pruning verified against deployment receipts.
    check_type: time_gated_production_data_check
    planned_command: "After 30 days of successful archive-aware publications accumulate, query the production archive at both retention boundaries and reconcile all edition identities to Pages deployment receipts."
    comparison_mode: "the complete available 30-day window is receipt-backed, the boundary day follows configured policy, and no older edition is returned"
    side_effects: "Read-only production API and GitHub Actions receipt inspection."
    current_status: BLOCKED
    blockers:
      - "Thirty days of real archive-aware successful publication data has not yet accumulated. This live gate must remain blocked until it does."
