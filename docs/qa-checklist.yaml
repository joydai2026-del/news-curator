    description: Translation distributional evaluation, human labels, tripwires, rollback, and weekly sampling.
  live_proven:
    description: The real scheduled or user-facing production path on the reviewed build.
criteria:
  - id: NCV3-01
    group: locally_provable
    description: Named deterministic, newsletter-privacy, workflow-contract, source-platform, personalization, and translation suites are green. Collected-test count is only an anti-deletion tripwire.
    check_type: test_suite
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q -m 'not allow_socket'"
    comparison_mode: "suite exit status equals 0; retain collected count only as a non-quality regression signal"
    side_effects: "Reads local code and fixtures. No network marker."
    current_status: GREEN
    blockers: []
  - id: NCV3-02
    group: locally_provable
    description: RSS, Atom, news-sitemap, and JSON Feed additions use only a configuration row and fixture. Collector, rank, dedupe, and render remain unchanged. An injected registry has no global-registration leakage.
    check_type: code_audit_and_contract_test
    code_audit_target:
      - "curator/sources/registry.py"
      - "curator/sources/feed.py"
      - "curator/sources/news_sitemap.py"
      - "curator/sources/json_feed.py"
      - "curator/pipeline.py"
      - "curator/rank.py"
      - "curator/dedup.py"
      - "curator/render.py"
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_source_config_only.py tests/test_source_contracts.py tests/test_backend_integration.py"
    comparison_mode: "fixture/config-only additions leave collector, rank, dedupe, and render diffs empty; injected registries do not share registrations"
    side_effects: "Reads local fixtures and configuration only."
    current_status: GREEN
    blockers: []
  - id: NCV3-03
    group: locally_provable
    description: Source contracts isolate a source failure, preserve configured order under concurrency, enforce global source ids and source policy, and preserve Hacker News category/query context.
    check_type: contract_test
    code_audit_target:
      - "curator/sources/base.py"
      - "curator/sources/registry.py"
      - "curator/sources/hackernews.py"
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_source_contracts.py tests/test_source_policy.py"
    comparison_mode: "configured source order equals result order; one source failure leaves unrelated configured sources available"
    side_effects: "Uses fake transport and clock only."
    current_status: GREEN
    blockers: []
  - id: NCV3-04
    group: locally_provable
    description: Safe transport rejects private or ambiguous targets and hostile responses before data can be sent, while enforcing redirect, byte, parse-depth, MIME, timeout, and per-host limits.
    check_type: security_threat_test
    code_audit_target:
      - "curator/sources/transport.py"
      - "curator/sources/base.py"
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_safe_transport.py"
    comparison_mode: "private or peer-mismatched target produces zero transmitted HTTP bytes; each hostile fixture yields its typed rejection code"
    side_effects: "Local fake DNS, sockets, and test server only. No external network."
    current_status: GREEN
    blockers: []
  - id: NCV3-05
    group: locally_provable
    description: Credential sentinels attach only to the exact approved origin, strip on cross-origin redirects, and never appear in console output, health, summaries, caches, artifacts, or rendering.
    check_type: security_sentinel_test
    code_audit_target:
      - "curator/sources/transport.py"
      - "curator/translation/google.py"
      - "curator/health.py"
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_safe_transport.py tests/test_google_translation_adapter.py tests/test_translation_store.py tests/test_secret_leaks.py"
    comparison_mode: "unique injected sentinel is absent from every captured output sink; credential present only on exact-origin request"
    side_effects: "Uses synthetic credentials and local captured outputs only."
    current_status: GREEN
    blockers: []
  - id: NCV3-06
    group: locally_provable
    description: Newsletter privacy remains green. Import-boundary and sentinel tests prove newsletter and preference data cannot create TranslationInput or reach translation cache, budget, provider, or logs.
    check_type: privacy_boundary_test
    code_audit_target:
      - "curator/newsletter/"
      - "curator/translation/base.py"
      - "curator/translation/bridge.py"
    planned_command: "uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_newsletter_privacy.py tests/test_newsletter_wiring.py tests/test_translation_privacy.py"
    comparison_mode: "synthetic newsletter and preference sentinels do not appear at any translation boundary"
    side_effects: "Uses local synthetic private data only."
    current_status: GREEN
    blockers: []
  - id: NCV3-07
    group: locally_provable
    description: Local Supabase reset and API integration prove migration validity, owner-only RLS, revoked grants, bounded JSON, least-privilege functions, and denials for anon, expired JWT, cross-user, altered-id, and direct-table-bypass cases.
    check_type: local_database_integration
    code_audit_target:
      - "supabase/migrations/*_user_preferences.sql"
      - "docs/contracts/personalization.md"
      - "tests/_personalization_local_harness.py"
      - "tests/test_personalization_local_db.py"
    planned_command: "supabase db reset && eval \"$(supabase status -o env)\" && NEWS_CURATOR_LOCAL_SUPABASE_URL=\"$API_URL\" NEWS_CURATOR_LOCAL_SUPABASE_ANON_KEY=\"$ANON_KEY\" NEWS_CURATOR_LOCAL_SUPABASE_SERVICE_ROLE_KEY=\"$SERVICE_ROLE_KEY\" NEWS_CURATOR_LOCAL_SUPABASE_JWT_SECRET=\"$JWT_SECRET\" uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_personalization_local_db.py"
    comparison_mode: "all authorized owner operations succeed; every listed unauthorized operation is denied by the local API/database"
    side_effects: "Resets only the linked local Supabase development database. Never run against a cloud project."
    current_status: PARTIAL
    blockers:
      - "The full loopback-only API/RLS matrix is implemented, including expired-JWT denial, saved-search shape and size limits, owner and cross-user isolation, column-grant bypasses, delete isolation, and function grants. Local Supabase plus its local JWT signing secret are unavailable, so none of that database matrix has a fresh execution receipt."
  - id: NCV3-08
    group: locally_provable
    description: Local database tests prove atomic compare-and-swap preferences updates, server-only revision increment, distinct conflicts, and prevention of concurrent lost updates.
    check_type: local_database_concurrency_test
    code_audit_target:
      - "supabase/migrations/*_user_preferences.sql"
      - "scripts/personalization_cli.py"
    planned_command: "supabase db reset && uv run pytest -p no:cacheprovider -o addopts='' -q tests/test_personalization_cas.py tests/test_personalization_local_db.py"
    comparison_mode: "one concurrent update commits, stale expected_revision returns conflict, and clients cannot set or decrease revision"
    side_effects: "Resets only the local Supabase development database."
    current_status: PARTIAL
    blockers:
      - "The compare-and-swap RPC and deterministic client tests exist, but local database concurrency remains unproved while Supabase is unavailable."
  - id: NCV3-09
    group: locally_provable
    description: PKCE browser callback and CLI tests prove state and nonce validation, replay rejection, exact redirects, history cleanup, token lifecycle safety, safe protected-storage failure, no token output, and two-user isolation.
    check_type: auth_contract_test
    code_audit_target:
