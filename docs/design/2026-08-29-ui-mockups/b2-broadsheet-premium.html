<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Curator (Direction B2)</title>
<style>
:root{
  --bg:#ffffff; --paper:#ffffff; --tint:#fbfbfd;
  --fg:#1d1d1f; --fg2:#424245; --muted:#6e6e73; --faint:#86868b;
  --line:#e8e8ed; --hair:#d2d2d7;
  --acc:#0071e3;
  --fbA:#f4f4f6; --fbB:#e6e6ea; --fbtext:#86868b;
  --serif:ui-serif,"New York",Georgia,"Songti SC","Noto Serif SC","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",ui-sans-serif,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:var(--serif);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --paper:#0a0a0b; --tint:#0a0a0b;
    --fg:#f5f5f7; --fg2:#d2d2d7; --muted:#a1a1a6; --faint:#86868b;
    --line:#1e1e21; --hair:#2c2c2e;
    --acc:#2997ff;
    --fbA:#141416; --fbB:#232326; --fbtext:#86868b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:16px;line-height:1.5;
     overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}

/* masthead */
.masthead{padding:44px 0 26px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.mleft,.mright{font-family:var(--sans);font-size:11px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
.mright{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.title{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,48px);letter-spacing:-.028em;
       text-align:center;line-height:1;margin:0;white-space:nowrap}
.subrule{margin-top:14px;text-align:center;font-family:var(--sans);font-size:12.5px;letter-spacing:.01em;color:var(--muted)}
.langseg{display:inline-flex;background:var(--tint);border:1px solid var(--line);border-radius:980px;padding:2px}
.langseg button{font-family:var(--sans);font-size:12.5px;letter-spacing:.01em;padding:5px 13px;border-radius:980px;
                color:var(--muted);text-transform:none;transition:color .15s,background .15s}
.langseg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){ .langseg button[aria-pressed="true"]{background:#1c1c1e;box-shadow:none} }

/* nav + saved searches */
.navbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.navbar .wrap{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}
.navbar .wrap::-webkit-scrollbar{display:none}
.navbar a{font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.01em;color:var(--muted);
          padding:13px 14px;white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .15s}
.navbar a:first-child{padding-left:0}
.navbar a:hover{color:var(--fg)}
.navbar a.on{color:var(--fg);font-weight:500;border-bottom-color:var(--fg)}
.clipbar{border-bottom:1px solid var(--line)}
.clipbar .wrap{display:flex;align-items:center;gap:14px;padding-top:11px;padding-bottom:11px;flex-wrap:wrap}
.cliplabel{font-family:var(--sans);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.search{display:flex;align-items:center;gap:8px;background:var(--tint);border:1px solid var(--line);
        border-radius:980px;padding:6px 14px}
.search input{border:0;background:none;outline:none;font-family:var(--sans);font-size:13.5px;color:var(--fg);width:210px}
.search input::placeholder{color:var(--faint)}
.savebtn{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--acc)}
.savebtn:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;
      border:1px solid var(--line);border-radius:980px;padding:4px 6px 4px 12px;color:var(--fg2);background:var(--tint)}
.chip span{cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span:hover{color:var(--acc)}
.chip b{font-weight:400;color:var(--faint);padding:0 4px}
.chip b:hover{color:var(--fg)}
.cliphint{font-family:var(--sans);font-size:12.5px;color:var(--faint)}
.notice{display:none;font-family:var(--sans);font-size:13.5px;color:var(--fg2);border-bottom:1px solid var(--line)}
.notice.on{display:block}
.notice .wrap{display:flex;align-items:center;gap:12px;padding:12px 32px}
.notice button{margin-left:auto;font-weight:500;color:var(--acc);font-size:13px}

/* sections: quiet header, one hairline, generous air */
.cat{padding-top:64px;scroll-margin-top:56px}
.cat:first-child{padding-top:44px}
.band{display:flex;align-items:baseline;gap:14px;padding:0 0 12px;border-bottom:1px solid var(--hair)}
.band>span:first-child{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.09em;
                       text-transform:uppercase;color:var(--fg)}
.band .n{margin-left:auto;font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--faint);font-weight:400}

.leadrow{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(0,1fr);gap:0;
         border-bottom:1px solid var(--line)}
.lead{padding:34px 40px 38px 0;border-right:1px solid var(--line);min-width:0}
.leadlink{display:block}
.lead .fig{margin-bottom:22px;position:relative;background:linear-gradient(150deg,var(--fbA),var(--fbB));
           aspect-ratio:16/9;overflow:hidden;border-radius:6px}
.lead .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
               transition:transform .5s cubic-bezier(.2,.7,.3,1),opacity .3s}
.leadlink:hover .fig img{transform:scale(1.014)}
.fbword{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;font-family:var(--sans);
        font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fbtext)}
.kicker{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
        color:var(--acc);margin-bottom:10px}
.lead h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.6vw,38px);line-height:1.12;
         letter-spacing:-.024em;margin:0 0 12px}
.leadlink:hover h2{color:var(--acc)}
.deck{margin:0 0 12px;font-size:17px;line-height:1.5;color:var(--fg2);
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.altline{margin:0 0 10px;font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.meta{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:var(--faint);
      display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tag{color:var(--muted);cursor:pointer}
.tag:hover{color:var(--acc)}
.sep{color:var(--hair)}

.lead.textlead{padding-top:36px}
.lead.textlead h2{font-size:clamp(28px,3vw,40px)}
.sublead{margin-top:30px;border-top:1px solid var(--line);padding-top:24px;display:grid;
         grid-template-columns:1fr 1fr;gap:26px 34px}
.sublead h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.24;letter-spacing:-.012em}
.sublead .sl:hover h4{color:var(--acc)}
.sublead p{margin:0 0 8px;font-size:14.5px;line-height:1.45;color:var(--muted);
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ranked{list-style:none;margin:0;padding:34px 0 38px 40px;min-width:0}
.ranked li{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ranked li:first-child{padding-top:0}
.ranked li:last-child{border-bottom:0;padding-bottom:0}
.rank{font-family:var(--sans);font-weight:500;font-size:12px;line-height:1.7;color:var(--faint);min-width:14px}
.ranked h4{margin:0 0 5px;font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.24;letter-spacing:-.012em}
.ranked li:hover h4{color:var(--acc)}
.ranked .meta{font-size:11.5px}

.briefs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 34px;padding:30px 0 4px}
.brief{min-width:0}
.brief h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.26;letter-spacing:-.01em}
.brief:hover h4{color:var(--acc)}
.brief p{margin:0 0 8px;font-size:14.5px;line-height:1.45;color:var(--muted);
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{display:flex;justify-content:flex-end;padding:6px 0 0}
.more button{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--acc)}
.more button:hover{text-decoration:underline}
.empty{font-family:var(--sans);font-size:14px;color:var(--muted);padding:28px 0}

.nlpanel{margin:30px 0 6px;padding:44px 44px 46px;border:1px solid var(--line);border-radius:10px;background:var(--tint)}
.nlpanel .kicker{color:var(--faint)}
.nlpanel h3{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.5vw,32px);line-height:1.16;
            letter-spacing:-.024em;margin:0 0 14px;max-width:22ch}
.nlpanel p{margin:0;max-width:60ch;font-size:16px;line-height:1.55;color:var(--fg2)}
.nlrules{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;font-family:var(--sans);font-size:12px;color:var(--muted)}
.nlrules span{border:1px solid var(--line);border-radius:980px;padding:5px 13px;background:var(--paper)}

footer{border-top:1px solid var(--line);margin-top:72px}
footer .wrap{padding:28px 32px 72px;font-family:var(--sans);font-size:12.5px;line-height:1.75;color:var(--faint)}

@media (max-width:1040px){ .briefs{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:880px){
  .leadrow{grid-template-columns:minmax(0,1fr)}
  .lead{border-right:0;border-bottom:1px solid var(--line);padding:28px 0 30px}
  .ranked{padding-left:0}
  .title{white-space:normal}
  .mrow{grid-template-columns:1fr;gap:12px;text-align:center}
  .mright{justify-content:center}
  .mleft{text-align:center}
  .cat{padding-top:48px}
}
@media (max-width:640px){
  .briefs{grid-template-columns:minmax(0,1fr)}
  .wrap{padding:0 20px}
  .notice .wrap{padding:12px 20px}
  .sublead{grid-template-columns:1fr;gap:22px}
  .masthead{padding:30px 0 20px}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="mrow">
      <div class="mleft" id="built"></div>
      <h1 class="title">News Curator</h1>
      <div class="mright">
        <div class="langseg" role="group">
          <button id="lang-en" aria-pressed="true">EN</button>
          <button id="lang-zh" aria-pressed="false">中文</button>
        </div>
      </div>
    </div>
    <div class="subrule" id="tagline"></div>
  </div>
</header>

<nav class="navbar"><div class="wrap" id="nav"></div></nav>

<div class="clipbar"><div class="wrap">
  <span class="cliplabel" id="t-saved"></span>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off">
  </div>
  <button class="savebtn" id="saveq"></button>
  <div class="chips" id="chips"></div>
  <span class="cliphint" id="t-savedhint"></span>
</div></div>

<div class="notice" id="notice"><div class="wrap"><span id="noticetext"></span><button id="clearq"></button></div></div>

<div class="wrap"><div id="sections"></div></div>

<footer><div class="wrap">
  <div id="foot1"></div>
  <div id="foot2"></div>
</div></footer>

动或许是：这个以偷车犯罪命名、走过近30年历程的系列，首次让劫持车辆这件事变得充满技巧性与趣味性。 阅读全文","published":"Sat, 29 Aug 2026 06:20:20 GMT"},{"title":"参展的不仅只是玩家 科隆展参展商吐槽昂贵电脑被盗","url":"https://www.cnbeta.com.tw/articles/game/1575484.htm","source":"cnBeta","image":null,"desc":"浑水摸鱼总是屡见不鲜，偌大的科隆游戏展也绝不是克律净土，8月28日，一位参展科隆展的独立游戏开发者表示自己昂贵的电脑器材被盗，不仅仅是钱包收到物理打击，电脑里的珍贵数据丢失更加让自己遭受精神打击。 阅读全文","published":"Sat, 29 Aug 2026 06:20:02 GMT"}],"zh_solidot":[{"title":"人形机器人的跑步方式与人类不同","url":"https://www.solidot.org/story?sid=85228","source":"Solidot","image":null,"desc":"北京人形机器人创新中心研发的通用人形机器人天工在世界人形机器人运动会上跑出了 100 米 8.64 秒的成绩，远超博尔特（Usain Bolt）于 2009 年创下的 100 米 9.58 秒的人类世界纪录。机器人的平均速度接近 42 公里/时。专家表示，这一成绩凸显了机器人的强大，也凸显了它们在决策和感知等方面的不足——人形机器人都是靠撞软垫的方式刹车的。人形机器人的跑步方式与人类不同：首先是博尔特的起跑仅仅花了 0.146 秒，相比下机器人等了近 1 秒钟才反应过来开始移动；博尔特仅用 41 步就完成了 100 米，而机器人花了 50 多步，机器人的","published":"Sat, 29 Aug 2026 18:46:44 +0800"},{"title":"程序员在公司厕所猝死，人社局以电脑没开不认定工伤","url":"https://www.solidot.org/story?sid=85227","source":"Solidot","image":null,"desc":"39 岁的深圳程序员邢志（化名）于 2026 年 4 月 23 日 8 时 56 分驾车进入公司所在办公楼负 2 楼停车，9 时步行至电梯厅询问值班安保 2 楼卫生间位置，1 分钟后，其到达卫生间一直未出，直至 11 时 28 分被发现失去意识躺坐在马桶上。公司随即用 AED 进行急救并拨打 120。12 时 50 分，医生停止急救，确认邢志死亡。邢志去世后，公司进行了一定补偿，向深圳市人社局申请工伤认定。7 月 3 日，人社局发出了《深圳市不予认定工伤决定书》。决定书显示，其情形不符合《广东省工伤保险条例》第九条、第十条，不予认定或视同工伤。工伤科工作","published":"Sat, 29 Aug 2026 17:57:06 +0800"},{"title":"澳大利亚有望在未来十年消灭宫颈癌","url":"https://www.solidot.org/story?sid=85226","source":"Solidot","image":null,"desc":"宫颈癌是女性第四大常见癌症，而 99% 的宫颈癌病例是由高危型人乳头瘤病毒（HPV）引起的。2006 年澳大利亚在全球率先推出首款宫颈癌疫苗，至今已有 20 年。该疫苗除了预防宫颈癌，还能预防咽喉癌、生殖器癌和肛门癌。因此男女都能从接种疫苗上受益。澳大利亚也是第一个全额资助 HPV 疫苗接种计划的国家，自 2007 年起，澳大利亚 26 岁以下女孩和年轻女性可免费接种该疫苗，2013 年起男孩和年轻男性也纳入该计划。澳大利亚有望在未来十年消灭宫颈癌。但世界各地的疫苗接种率都因为新冠疫情而大幅下降，澳大利亚也存在这一情况：到 15 岁时女孩的 HPV 疫苗","published":"Sat, 29 Aug 2026 00:41:00 +0800"},{"title":"一次性纸杯会释放大量微塑料","url":"https://www.solidot.org/story?sid=85225","source":"Solidot","image":null,"desc":"一次性纸杯虽然主要是纸做的，但并非没有使用塑料，为提高防水性和结构完整性，纸杯内有一层薄塑料内衬，使用的材料可能是聚乙烯或可生物降解的聚乳酸。昆士兰大学的研究人员发现，一次性纸杯在接触热水时会释放大量的微米级和纳米级塑料物质。测量发现，聚乳酸内衬纸杯每毫升含有约 430 万个纳米颗粒，而聚乙烯内衬纸杯每毫升含有约 270 万个纳米颗粒。聚乳酸纸杯释放的塑料颗粒总数是聚乙烯纸杯的 12 倍。研究进一步证实，用于食品储存和制备的新塑料制品是人类通过摄入途径接触塑料的重要来源。","published":"Fri, 28 Aug 2026 23:26:43 +0800"},{"title":"无人机拍下了引发中尼边境致命泥石流的冰川崩塌","url":"https://www.solidot.org/story?sid=85224","source":"Solidot","image":null,"desc":"根据网友在小红书上发布、由 BBC 验证真实性的两则无人机拍摄视频，视频记录了喜马拉雅山脉蓝塘里壤峰冰川崩塌的瞬间，中尼边境的致命泥石流灾害正是由其引发的。蓝塘里壤峰海拔约 7200 米，冰川崩塌扬起的尘土直冲云霄。截至目前，尼泊尔报告其境内的死亡人数达到了 547 人，失踪外国游客 575 人——其中包括 183 名印度公民、65 名美国公民、62 名乌克兰公民以及 33 名英国公民，此外还有 149 名尼泊尔游客失踪。中国西藏境内目前只报告 5 人死亡，558 人失踪，其中 260 人为外国人。","published":"Fri, 28 Aug 2026 22:39:21 +0800"},{"title":"美国将意大利安全托管服务商列入恐怖分子名单","url":"https://www.solidot.org/story?sid=85223","source":"Solidot","image":null,"desc":"美国国务院和财政部周三将一家提供加密聊天和电子邮件、网站托管、安全视频会议和流媒体等服务的意大利组织 Autistici/Inventati 列入特别指定全球恐怖分子名单，这意味着美国公民与该组织进行的任何交易都是违法的。美国国务院列举的一个理由是该组织为极左翼组织如 Antifa 提供了数字基础设施，让极左激进分子能在保持“匿名、无法追踪且不受法律制裁”的情况下“传播目标信息、战术手册和技术以及关于近期袭击的通告”。美国政府此举引起广泛争议，可能导致该组织域名 autistici.org 被美国域名管理机构封禁。Autistici/Inventati ","published":"Fri, 28 Aug 2026 21:33:01 +0800"},{"title":"德国 Sovereign Tech 基金资助 Flatpak 逾 50 万欧元","url":"https://www.solidot.org/story?sid=85222","source":"Solidot","image":null,"desc":"德国的 Sovereign Tech 基金将在未来两年资助 Flatpak 项目 508,640 欧元，帮助 Flatpak 打造更安全、更完善的沙盒平台。Flatpak 是 Red Hat 主导开发的 Linux 应用打包格式，类似 Canonical 主导的 Snap，它提供了一个沙盒环​​境，其中运行的应用与系统其他部分隔离。这笔资金将用于开发：围绕 PipeWire 的音频隔离功能，网络隔离的新功能，第三方 VPN 应用能管理系统级连接，辅助写作，密码自动填充，等等。","published":"Fri, 28 Aug 2026 18:49:29 +0800"},{"title":"IBM 推出双指令集处理器","url":"https://www.solidot.org/story?sid=85221","source":"Solidot","image":null,"desc":"IBM 在 Hot Chips 2026 上介绍了世界首款双指令集处理器。全球约七成交易量都通过 IBM Z 大型机完成，新处理器通过引入 Arm 生态系统，为大型机带来新一代的应用。该处理器采用 2 纳米工艺节点，包括 11 个主频超过 5.7 GHz 的高性能核心、面向交易过程中欺诈检测的 AI 推理加速器、用于 I/O 加速的专用片上数据处理单元以及面向高负载企业级应用的大容量缓存架构。该芯片并未采用彼此独立的 Arm 核心和 IBM 核心。每个处理器核心均可原生执行 Arm 与 IBM Z 指令，或 Arm 与 LinuxONE 指令，同时保持平","published":"Fri, 28 Aug 2026 18:06:32 +0800"},{"title":"法国法庭认定辐射与空乘罹患乳腺癌相关","url":"https://www.solidot.org/story?sid=85220","source":"Solidot","image":null,"desc":"法国法院首次认定宇宙辐射是一名空姐罹患乳腺癌的职业因素，其他相关因素包括被动吸烟和长年夜班工作。这一裁决可能会为类似诉讼打开大门，因为研究不断表明，长期高空飞行与辐射相关癌症暴露水平升高相关。59 岁的 Sophie Lainault 曾是法航的一名空姐，她一直寻求将自己的癌症认定为职业病，认为是由工作环境造成的。她一开始是空姐，后担任乘务长，于 1989-2019 年间累计飞行 12600 小时，逾半数是夜班，而从巴黎出发的长途航班通常使用北极航线，北极的磁场防护较弱，因此辐射暴露水平更高。哈佛医学院在本月发表的一项研究发现，逾 500 种职业中，空乘","published":"Fri, 28 Aug 2026 16:14:19 +0800"},{"title":"Haiku R1/beta6 释出","url":"https://www.solidot.org/story?sid=85219","source":"Solidot","image":null,"desc":"开源 BeOS 操作系统 Haiku 在发布第 5 个 beta 版本 2 年后释出了第 6 个 beta 版本。BeOS 操作系统在 2001 年被 Palm 收购后停止开发，Haiku 项目在这之后不久正式启动，2002 年发布了首个版本，2012 年发布 Haiku R1 Alpha 4.1，六年后发布了 Haiku R1/beta1。beta6 主要是改进功能和整体稳定性。新版的主要变化包括：移植了 Firefox，改进对 Qemu 的支持，基于 OpenBSD 的内存分配机制，改进对不同文件系统的支持，修复了逾 530 个 bug，移植了大量新","published":"Fri, 28 Aug 2026 15:08:27 +0800"},{"title":"Google 要求 Android 应用开发商降低内存占用","url":"https://www.solidot.org/story?sid=85218","source":"Solidot","image":null,"desc":"由于 AI 热导致内存短缺，无论是 PC 还是智能手机，都面临内存价格太昂贵而不得不减少内存容量的问题，PC 行业时隔多年再次推出了 8GB 内存 PC，智能手机厂商也面临相同问题。对此 Google 采取了应对措施，要求Android 应用开发商优化代码降低内存占用。Google 说，移动行业面临改变设备内存可用性的严重硬件供应限制，进而影响到用户使用体验。Google 增加了代码优化要求，防止应用运行缓慢和崩溃等与性能相关的问题。应用开发商需要在 2027 年 2 月前满足内存使用要求。","published":"Fri, 28 Aug 2026 14:49:13 +0800"},{"title":"气候变暖放大东太平洋的厄尔尼诺变率","url":"https://www.solidot.org/story?sid=85217","source":"Solidot","image":null,"desc":"发表在《科学》期刊上的一项研究分析了加拉帕戈斯群岛（Galápagos）珊瑚长达千年的记录，发现随着地球变暖，厄尔尼诺现象正在加剧，东太平洋的厄尔尼诺-南方涛动（ENSO）变率比工业化前时代高出了约 36.5%。这些发现表明，气候变化已经在放大全球最重要的极端天气来源之一，并可能对生态系统、基础设施和人类社会带来日益增长的风险。ENSO 是导致年际气候极端事件的主要原因，它与干旱、洪水、野火、珊瑚白化事件以及对农业和人类健康的影响相关。该现象源于热带太平洋与大气之间的复杂相互作用。近几十年来发生了数次异常强烈的厄尔尼诺事件，其变暖范围覆盖了热带太平洋的大","published":"Fri, 28 Aug 2026 11:51:23 +0800"}],"zh_rfi":[{"title":"中共前湖北省委书记蒋超良一审被判死缓不得减刑","url":"https://www.rfi.fr/cn/%E4%B8%AD%E5%9B%BD/20260829-%E4%B8%AD%E5%85%B1%E5%89%8D%E6%B9%96%E5%8C%97%E7%9C%81%E5%A7%94%E4%B9%A6%E8%AE%B0%E8%92%8B%E8%B6%85%E8%89%AF%E4%B8%80%E5%AE%A1%E8%A2%AB%E5%88%A4%E6%AD%BB%E7%BC%93%E4%B8%8D%E5%BE%97%E5%87%8F%E5%88%91","source":"RFI 中文","image":"https://s.rfi.fr/media/display/5bbe2c10-a3ae-11f1-8fed-005056a97e36/w:1024/p:16x9/JiangChaoliang20260828Nanjing174056-67946.jpg","desc":"中共原湖北省委书记蒋超良8月28日被南京中院一审判处死缓。蒋超良被指控从政30多年来，敛财折合人民币超过7.46亿元。该判决规定在死缓转为无期徒刑后，不得减刑或假释。","published":"Sat, 29 Aug 2026 13:35:01 GMT"},{"title":"喜马拉雅山洪至少633人遇难，救援队加紧搜寻约3000名失踪人员","url":"https://www.rfi.fr/cn/%E5%9B%BD%E9%99%85/20260829-%E5%96%9C%E9%A9%AC%E6%8B%89%E9%9B%85%E5%B1%B1%E6%B4%AA%E8%87%B3%E5%B0%91633%E4%BA%BA%E9%81%87%E9%9A%BE%EF%BC%8C%E6%95%91%E6%8F%B4%E9%98%9F%E5%8A%A0%E7%B4%A7%E6%90%9C%E5%AF%BB%E7%BA%A63000%E5%90%8D%E5%A4%B1%E8%B8%AA%E4%BA%BA%E5%91%98","source":"RFI 中文","image":"https://s.rfi.fr/media/display/dcc7862c-a39e-11f1-954c-005056bf30b7/w:1024/p:16x9/2026-08-29T070002Z-138429695-RC238NAD8C2C-RTRMADP-3-NEPAL-FLOODS.jpg","desc":"周六，救援人员加紧努力，试图寻找约3000名失踪人员，并疏散被困在尼泊尔与中国边境的幸存者。此前三天，一场可怕的洪灾造成600多人死亡，并留下一片满目疮痍的景象。","published":"Sat, 29 Aug 2026 11:48:24 GMT"},{"title":"美国如何失去加拿大稳定而平价的原油供应","url":"https://www.rfi.fr/cn/%E7%BE%8E%E6%B4%B2/20260829-%E7%BE%8E%E5%9B%BD%E5%A6%82%E4%BD%95%E5%A4%B1%E5%8E%BB%E5%8A%A0%E6%8B%BF%E5%A4%A7%E7%A8%B3%E5%AE%9A%E8%80%8C%E5%B9%B3%E4%BB%B7%E7%9A%84%E5%8E%9F%E6%B2%B9%E4%BE%9B%E5%BA%94","source":"RFI 中文","image":"https://s.rfi.fr/media/display/0b5c6008-a3ad-11f1-a08f-005056bf30b7/w:1024/p:16x9/AP26238851447349.jpg","desc":"美国总统特朗普于周五（8月28日）高调宣布，与委内瑞拉达成一项号称历史上最大的石油协议，宣称将透过公私合营掌控委国关键油田高达650亿桶的探明储量。","published":"Sat, 29 Aug 2026 13:31:39 GMT"},{"title":"中资水坝贪腐案：厄瓜多尔前总统莫雷诺、中国前大使均判5年徒刑","url":"https://www.rfi.fr/cn/%E4%B8%AD%E5%9B%BD/20260829-%E4%B8%AD%E8%B5%84%E6%B0%B4%E5%9D%9D%E8%B4%AA%E8%85%90%E6%A1%88-%E5%8E%84%E7%93%9C%E5%A4%9A%E5%B0%94%E5%89%8D%E6%80%BB%E7%BB%9F%E8%8E%AB%E9%9B%B7%E8%AF%BA-%E4%B8%AD%E5%9B%BD%E5%89%8D%E5%A4%A7%E4%BD%BF%E5%9D%87%E5%88%A45%E5%B9%B4","source":"RFI 中文","image":"https://s.rfi.fr/media/display/06920c76-a353-11f1-891a-005056bf30b7/w:1024/p:16x9/AP26240755770688.jpg","desc":"路透社基多消息，厄瓜多尔一家法院于周五裁定前总统莫雷诺（Lenin Moreno）因收受建造该国最大水力发电大坝的中国公司贿赂，贪污罪名成立。現年 73 岁的莫雷诺被判处 5 年监禁，并被终身禁止担任任何公职。","publis ","image":"https://s.rfi.fr/media/display/a410718a-a39f-11f1-b1f7-005056bf30b7/w:1024/p:16x9/2026-08-20T043104Z-1320924491-RC2O1NAYKO0H-RTRMADP-3-CHINA-FILM-NIULAI.jpg","desc":"中国低成本国产动画片《牛来》票房破五千万，不仅在网上衍生出层出不穷的再创，更成为国际媒体报导的奇特文化现象。究竟网友们怎么评价这部片？既然知道它烂为何还是愿意花钱去看？但随着《牛来》爆红，网上也出现这部极致烂片是为了要片中国政府的补助。","published":"Sat, 29 Aug 2026 13:16:11 GMT"},{"title":"台湾九合一大选将合并废除非核家园公投 民团质疑公投沦为政党操弄选举工具","url":"https://www.rfi.fr/cn/%E6%B8%AF%E6%BE%B3%E5%8F%B0/20260829-%E5%8F%B0%E6%B9%BE%E4%B9%9D%E5%90%88%E4%B8%80%E5%A4%A7%E9%80%89%E5%B0%86%E5%90%88%E5%B9%B6%E5%BA%9F%E9%99%A4%E9%9D%9E%E6%A0%B8%E5%AE%B6%E5%9B%AD%E5%85%AC%E6%8A%95-%E6%B0%91%E5%9B%A2%E8%B4%A8%E7%96%91%E5%85%AC%E6%8A%95%E6%B2%A6%E4%B8%BA%E6%94%BF%E5%85%9A%E6%93%8D%E5%BC%84%E9%80%89%E4%B8%BE%E5%B7%A5%E5%85%B7","source":"RFI 中文","image":"https://s.rfi.fr/media/display/b8c03eb0-a37e-11f1-998a-005056bfb2b6/w:1024/p:16x9/Taiwan-You-YInglong-referendum2026.jpg","desc":"中选会28日审议在野党日前于立法院所提三项公投案，最终仅「废除非核家园」公投闯关成功，将于11月与九合一选举合并投票。 「鞭刑公投」、「交通罚锾专用」均遭否决。","published":"Sat, 29 Aug 2026 07:54:01 GMT"},{"title":"日本大学生时隔七年赴俄罗斯交流","url":"https://www.rfi.fr/cn/%E4%BA%9A%E6%B4%B2/20260829-%E6%97%A5%E6%9C%AC%E5%A4%A7%E5%AD%A6%E7%94%9F%E6%97%B6%E9%9A%94%E4%B8%83%E5%B9%B4%E8%B5%B4%E4%BF%84%E7%BD%97%E6%96%AF%E4%BA%A4%E6%B5%81","source":"RFI 中文","image":"https://s.rfi.fr/media/display/ab31720e-972c-11f1-a3ef-005056a97e36/w:1024/p:16x9/AP26203169975315.jpg","desc":"日本外务省8月28日透露，日本重新启动了自2019年最后一次实施以来中断了的向俄罗斯短期派遣日本大学生等人员交流项目。这是时隔7年再次派遣，共有15名学习俄语等课程的大学生等，于本月12日至20日期间在俄罗斯第二大城市圣彼得堡停留，参加俄语培训、与当地学生交流，并参观了大学的教室、学生宿舍等设施，此次赴俄由“日俄青年交流中心”及参加者所属大学共同进行了人员募集。","published":"Sat, 29 Aug 2026 08:03:01 GMT"},{"title":"喜马拉雅山区洪灾升至近600人死亡 约2500人失踪","url":"https://www.rfi.fr/cn/%E4%B8%AD%E5%9B%BD/20260828-%E5%96%9C%E9%A9%AC%E6%8B%89%E9%9B%85%E5%B1%B1%E5%8C%BA%E6%B4%AA%E7%81%BE%E5%8D%87%E8%87%B3%E8%BF%91600%E4%BA%BA%E6%AD%BB%E4%BA%A1-%E7%BA%A62500%E4%BA%BA%E5%A4%B1%E8%B8%AA","source":"RFI 中文","image":"https://s.rfi.fr/media/display/dd6d1dbc-a326-11f1-a9ef-005056bf30b7/w:1024/p:16x9/2026-08-28T114258Z-1032577050-RC2J7NA0DDQK-RTRMADP-3-NEPAL-FLOODS.jpg","desc":"尼泊尔与中国边境喜马拉雅山区26日发生毁灭性洪灾，造成的死亡人数升至近600人，约2500人失踪。救援人员周五（8月28日）继续与时间赛跑，全力搜寻可能的幸存者。法国外交部周五证实，有4名法国公民在这场洪灾中失联。红十字会与红新月会国际联合会驻尼泊尔代表称：“根据目前估算，可能约有9.3万人受到影响。这场灾难造成的创伤将极其严重。”","published":"Fri, 28 Aug 2026 21:24:41 GMT"},{"title":"法国地质学家 ：喜马拉雅山地海啸原因在于基岩不稳定而并非冰川","url":"https://www.rfi.fr/cn/%E4%BA%9A%E6%B4%B2/20260828-%E4%B8%AD%E5%B0%BC%E8%BE%B9%E7%95%8C%E5%B1%B1%E5%9C%B0%E6%B5%B7%E5%95%B8%E7%9A%84%E6%A0%B9%E6%9C%AC%E5%8E%9F%E5%9B%A0-%E5%B1%B1%E4%BD%93%E6%BB%91%E5%9D%A1%E8%BF%98%E6%98%AF%E5%86%B0%E5%B1%B1%E5%B4%A9%E5%A1%8C","source":"RFI 中文","image":"https://s.rfi.fr/media/display/d186a25a-a2c4-11f1-94b1-005056a90284/w:1024/p:16x9/AP26240082150595.jpg","desc":"8月26日发生在喜马拉雅山区中国西藏与尼泊尔边境的泥石流是山洪灾难规模空前，造成巨大的生命与财产损失，目前各国的专家们正在就此一灾难所造成的原因举行分析调查，随着时间的推移，事故原因也日渐明朗，法国知名的地球物理与地貌学家，目前在法国格勒诺布尔-阿尔卑斯大学（Université Grenoble Alpes）下属的法国地球科学研究院（ISTerre）任职的Kristen Cook在接受法国国际广播电台采访时表示根据对卫星图像的研究发现造成此次灾难的原因实际上并非冰川崩塌，而是一次大规模的山体滑坡：冰川位于滑坡体之上，因此随之崩塌。这意味着问题不在于冰川","published":"Fri, 28 Aug 2026 18:41:30 GMT"},{"title":"伊朗：美国加大制裁压力，中国对美表现强硬，但是……","url":"https://www.rfi.fr/cn/%E4%B8%93%E6%A0%8F%E6%A3%80%E7%B4%A2/%E6%B3%95%E5%9B%BD%E4%B8%96%E7%95%8C%E6%8A%A5/20260828-%E4%BC%8A%E6%9C%97-%E7%BE%8E%E5%9B%BD%E5%8A%A0%E5%A4%A7%E5%88%B6%E8%A3%81%E5%8E%8B%E5%8A%9B%EF%BC%8C%E4%B8%AD%E5%9B%BD%E5%AF%B9%E7%BE%8E%E8%A1%A8%E7%8E%B0%E5%BC%BA%E7%A1%AC%EF%BC%8C%E4%BD%86%E6%98%AF","source":"RFI 中文","image":"https://s.rfi.fr/media/display/bddd2032-0bde-11ea-9862-005056bff430/w:1024/p:16x9/fa_guo_shi_jie_bao_wb161923-rfi-cn-20150123_cartouche.jpg","desc":"法国世界报本周三表示，面对美国就伊朗及其贸易伙伴不断加大制裁压力，中国对美国表现强硬，但同时也避免与美国发生新的严重冲突。","published":"Fri, 28 Aug 2026 23:44:13 GMT"}],"zh_cna":[{"title":"台裔作家首入圍德國圖書獎　廖樂薇以小說書寫台灣民主","url":"https://www.cna.com.tw/news/acul/202608290196.aspx","source":"中央社 CNA","image":null,"desc":"（中央社記者林尚縈柏林29日專電）台裔德國作家廖樂薇以台灣為背景的首部長篇小說Glaszeit（暫譯：玻璃時代），入圍2026年德國圖書獎長名單，成為首位獲提名的台裔作家。她接受中央社訪問表示，台灣主權面臨威脅長期縈繞在她心中，希望透過小說讓台灣民主運動歷史 00"},{"title":"尼日國家電視台斷訊　機場、總統府附近激烈槍響","url":"https://www.cna.com.tw/news/aopl/202608290172.aspx","source":"中央社 CNA","image":null,"desc":"（中央社阿必尚29日綜合外電報導）尼日首都尼阿美部分區域夜間傳出激烈槍響，包括機場附近一處軍事基地的周圍，國家電視台則在今天上午斷訊。首都機場今年稍早已經兩度遭到聖戰分子攻擊。","published":"Sat, 29 Aug 2026 18:19:23 +0800"},{"title":"俄國無人機襲烏克蘭首都附近一處倉庫　至少27死","url":"https://www.cna.com.tw/news/aopl/202608290171.aspx","source":"中央社 CNA","image":null,"desc":"（中央社基輔29日綜合外電報導）烏克蘭當局指出，俄羅斯昨天晚間出動無人機攻擊烏國首都基輔附近一處倉庫，引發了大火與爆炸，並造成至少27人喪命。","published":"Sat, 29 Aug 2026 18:10:21 +0800"},{"title":"日圓貶值加物價上漲　日本防衛裝備最多貴7成","url":"https://www.cna.com.tw/news/aopl/202608290159.aspx","source":"中央社 CNA","image":null,"desc":"（中央社東京29日綜合外電報導）日本防衛省回顧現行2023年度到2027年度「防衛力整備計畫」的實際成果後，提出報告指出，受到日圓貶值與物價上漲等因素影響，主要防衛裝備較2023年度貴上4成到7成。","published":"Sat, 29 Aug 2026 17:11:53 +0800"},{"title":"尼泊爾洪災傾瀉速度驚人　倖存者：只有15秒能跑","url":"https://www.cna.com.tw/news/aopl/202608290145.aspx","source":"中央社 CNA","image":null,"desc":"（中央社記者李晉緯新德里29日專電）尼泊爾洪災迄今已奪走超過600條人命，逾2400人失聯。倖存者回憶，當時事態發展得很快，大概只有15秒的時間能反應，來不及跑的人可能都無法倖免於難。","published":"Sat, 29 Aug 2026 17:05:23 +0800"}],"tech_live":[{"title":"SEC Crypto Custody Rewrite Enters White House Review","url":"https://thedefiant.io/converge/regulation/sec-crypto-custody-rewrite-enters-white-house-review","source":"","image":"https://cdn.sanity.io/images/6oftkxoa/production/6d9fbb8531c1aa6addad885741ca06e35d79f654-2048x1152.png","desc":"The planned rule would cover advisers and investment companies and clarify digital-asset custody, following the withdrawal of a separate 2023 proposal.","topics":["crypto"]},{"title":"Spain Slows Nuclear Phase-out Amidst Energy Turbulence","url":"https://spectrum.ieee.org/spain-nuclear-power-reactor-shutdowns","source":"","image":"https://spectrum.ieee.org/media-library/three-women-in-hard-hats-and-safety-goggles-pulling-an-industrial-vacuum-through-a-nuclear-power-plant.jpg?id=67687223&amp;width=980","desc":"In a significant policy twist, on 14 August Spain’s government decreed a 3-year extens <script>
(function(){

var T = {

    cats:{trending:'Trending', world:'World', us:'US News', business:'Business', ai:'AI', crypto:'Crypto', quantum:'Quantum computing', energy:'Energy and nuclear', space:'Space technology', biotech:'Biotechnology', newsletters:'Newsletters', zhworld:'World', zhtech:'Technology'}
  },

    cats:{trending:'热门', world:'国际', us:'美国', business:'商业', ai:'人工智能', crypto:'加密货币', quantum:'量子计算', energy:'能源与核能', space:'太空科技', biotech:'生物科技', newsletters:'电子报', zhworld:'国际', zhtech:'科技'}
  }
};

var LS_LANG='nc-b2-lang', LS_SAVED='nc-b2-saved';
function readLS(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function writeLS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var lang = readLS(LS_LANG,'en')==='zh'?'zh':'en';
var query='', expanded={};
var saved=[]; try{ saved = JSON.parse(readLS(LS_SAVED,'[]'))||[]; }catch(e){ saved=[]; }

function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
/* only https: links and images are ever rendered; anything else becomes plain text */
function https(u){ return (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function rel(p){
  if(!p) return '';
  var t=new Date(p); if(isNaN(t.getTime())) return '';
  var s=(Date.now()-t.getTime())/1000;
  if(s<90) return lang==='zh'?'刚刚':'just now';
  var m=Math.floor(s/60); if(m<60) return lang==='zh'?(m+'分钟前'):(m+'m ago');
  var h=Math.floor(m/60); if(h<24) return lang==='zh'?(h+'小时前'):(h+'h ago');
  var d=Math.floor(h/24); if(d<30) return lang==='zh'?(d+'天前'):(d+'d ago');
  var mo=Math.floor(d/30); return lang==='zh'?(mo+'个月前'):(mo+'mo ago');
}

var TOPIC_LABEL = {
  'ai':{en:'AI',zh:'人工智能'}, 'crypto':{en:'Crypto',zh:'加密货币'},
  'quantum-computing':{en:'Quantum computing',zh:'量子计算'},
  'energy-and-nuclear':{en:'Energy and nuclear',zh:'能源与核能'},
  'space-technology':{en:'Space technology',zh:'太空科技'},
  'biotechnology':{en:'Biotechnology',zh:'生物科技'}
};
function norm(it, lane){
  var o={url:https(it.url), image:https(it.image)||null, lane:lane, source:it.source||host(it.url), published:it.published||null, tags:[], alt:'', snip:''};
  if(lane==='trending_buzzing'){
    if(lang==='zh'){ o.title=it.title; o.alt=it.desc||''; }
    else { o.title=it.desc||it.title; o.alt=it.title; }
  } else { o.title=it.title; o.snip=it.desc||''; }
  if(lane==='trending_hn'){ o.badge = it.desc || ''; o.snip = ''; }
  if(it.topics && it.topics.length) o.tags = it.topics.map(function(t){ return (TOPIC_LABEL[t]||{en:t,zh:t})[lang]; });
  return o;
}
function lanes(names){
  var pools = names.map(function(n){ return (L[n]||[]).map(function(it){ return norm(it,n); }); });
  var out=[], i=0, more=true;
  while(more){ more=false; for(var p=0;p<pools.length;p++){ if(pools[p][i]){ out.push(pools[p][i]); more=true; } } i++; }
  return out;
}
function techTopic(slug){
  return (L.tech_live||[]).filter(function(it){ return (it.topics||[]).indexOf(slug)>-1; }).map(function(it){ return norm(it,'tech_live'); });
}
function sections(){
  if(lang==='zh'){
    return [
      {id:'trending', h:14, s:'70%', get:function(){return lanes(['trending_buzzing','trending_hn']);}},
      {id:'zhworld', h:217, s:'60%', get:function(){return lanes(['zh_rfi','zh_cna']);}},
      {id:'zhtech', h:263, s:'50%', get:function(){return lanes(['zh_cnbeta','zh_solidot']);}},
      {id:'newsletters', h:174, s:'45%', get:function(){return [];}, newsletter:true}
    ];
  }
  return [
    {id:'trending', h:14, s:'70%', get:function(){return lanes(['trending_hn','trending_buzzing']);}},
    {id:'world', h:217, s:'60%', get:function(){return lanes(['world_cnn','world_bbc','world_guardian']);}},
    {id:'us', h:352, s:'55%', get:function(){return lanes(['us_fox','us_cbs']);}},
    {id:'business', h:160, s:'55%', get:function(){return lanes(['business_cnbc']);}},
    {id:'ai', h:263, s:'50%', get:function(){return techTopic('ai');}},
    {id:'crypto', h:24, s:'70%', get:function(){return techTopic('crypto');}},
    {id:'quantum', h:190, s:'60%', get:function(){return techTopic('quantum-computing');}},
    {id:'energy', h:88, s:'50%', get:function(){return techTopic('energy-and-nuclear');}},
    {id:'space', h:243, s:'48%', get:function(){return techTopic('space-technology');}},
    {id:'biotech', h:330, s:'55%', get:function(){return techTopic('biotechnology');}},
    {id:'newsletters', h:174, s:'45%', get:function(){return [];}, newsletter:true}
  ];
}
function matches(o){
  if(!query) return true;
  var q=query.toLowerCase();
  return (o.title||'').toLowerCase().indexOf(q)>-1 || (o.alt||'').toLowerCase().indexOf(q)>-1
      || (o.snip||'').toLowerCase().indexOf(q)>-1 || (o.source||'').toLowerCase().indexOf(q)>-1
      || (o.tags||[]).join(' ').toLowerCase().indexOf(q)>-1;
}
function tagFor(o){ return o.url ? 'a' : 'span'; }
function hrefFor(o){ return o.url ? ' href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer"' : ''; }
function metaHTML(o, secLabel, withTags, skipSource){
  var parts=[];
  if(o.source && !skipSource) parts.push('<span>'+esc(T[lang].via)+' '+esc(o.source)+'</span>');
  if(withTags){ (o.tags && o.tags.length ? o.tags : [secLabel]).slice(0,2).forEach(function(t){ parts.push('<span class="tag" data-tag="'+esc(t)+'">'+esc(t)+'</span>'); }); }
  if(o.badge) parts.push('<span>'+esc(o.badge)+'</span>');
  var w = rel(o.published); if(w) parts.push('<span>'+esc(w)+'</span>');
  return '<div class="meta">'+parts.join('<span class="sep">·</span>')+'</div>';
}
function leadHTML(o, label, extra){
  var fig = o.image
    ? '<div class="fig"><span class="fbword">'+esc(o.source)+'</span><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(o.image)+'" alt="" onerror="this.remove()"></div>'
    : '';
  var tg = tagFor(o);
  return '<div class="lead'+(o.image?'':' textlead')+'">'
    + '<'+tg+' class="leadlink"'+hrefFor(o)+'>'
    + fig
    + '<div class="kicker">'+esc(o.source ? (T[lang].via+' '+o.source) : label)+'</div>'
    + '<h2>'+esc(o.title)+'</h2>'
    + (o.alt?'<p class="altline">'+esc(o.alt)+'</p>':'')
    + (o.snip?'<p class="deck">'+esc(o.snip)+'</p>':'')
    + metaHTML(o,label,true,!!o.source)
    + '</'+tg+'>'
    + (extra||'') + '</div>';
}
/* the two stories that sit under a picture-less lead, so the column is filled with type */
function subleadHTML(list, label){
  if(!list.length) return '';
  return '<div class="sublead">'+list.map(function(o){
    var tg = tagFor(o);
    return '<'+tg+' class="sl" style="display:block;min-width:0"'+hrefFor(o)+'>'
      + '<h4>'+esc(o.title)+'</h4>'
      + (o.snip?'<p>'+esc(o.snip)+'</p>':(o.alt?'<p>'+esc(o.alt)+'</p>':''))
      + metaHTML(o,label,false)+'</'+tg+'>';
  }).join('')+'</div>';
}
function rankedHTML(list, label){
  return '<ol class="ranked">'+list.map(function(o,i){
    var tg = tagFor(o);
    return '<li><span class="rank">'+(i+1)+'</span><'+tg+' style="min-width:0;display:block"'+hrefFor(o)+'>'
      + '<h4>'+esc(o.title)+'</h4>'+(o.alt?'<p class="altline" style="margin:0 0 4px">'+esc(o.alt)+'</p>':'')+metaHTML(o,label,false)+'</'+tg+'></li>';
  }).join('')+'</ol>';
}
function briefsHTML(list, label){
  return '<div class="briefs">'+list.map(function(o){
    var tg = tagFor(o);
    return '<'+tg+' class="brief" style="display:block"'+hrefFor(o)+'>'
      + '<h4>'+esc(o.title)+'</h4>'
      + (o.snip?'<p>'+esc(o.snip)+'</p>':(o.alt?'<p>'+esc(o.alt)+'</p>':''))
      + metaHTML(o,label,true)+'</'+tg+'>';
  }).join('')+'</div>';
}
function fill(sec, node){
  var label = T[lang].cats[sec.id];
  var body = $('.catbody', node);
  node.style.display = '';
  if(sec.newsletter){
    if(query){ node.style.display='none'; return; }
    $('.n', node).textContent = T[lang].stories(0);
    body.innerHTML = '<div class="nlpanel"><div class="kicker">'+esc(T[lang].nlkicker)+'</div>'
      + '<h3>'+esc(T[lang].nltitle)+'</h3><p>'+esc(T[lang].nlbody)+'</p>'
      + '<div class="nlrules">'+T[lang].nlrules.map(function(r){return '<span>'+esc(r)+'</span>';}).join('')+'</div></div>';
    return;
  }
  var all = sec.get().filter(matches);
  $('.n', node).textContent = T[lang].stories(all.length);
  if(!all.length){ if(query){ node.style.display='none'; return; } body.innerHTML = '<p class="empty">'+esc(T[lang].empty)+'</p>'; return; }
  var open = expanded[sec.id] || !!query;
  var arr = all.slice();
  var hi = arr.findIndex(function(o){ return !!o.image; });
  if(hi > 0) arr.unshift(arr.splice(hi,1)[0]);
  var lead = arr[0];
  var textLead = !lead.image;
  var subs = textLead ? arr.slice(1,5) : [];
  var cut = 1 + subs.length;
  var ranked = arr.slice(cut, cut+5);
  var rest = cut + ranked.length;
  var briefs = open ? arr.slice(rest,30) : arr.slice(rest, rest+4);
  var html = '<div class="leadrow">'+leadHTML(lead,label,subleadHTML(subs,label))+rankedHTML(ranked,label)+'</div>';
  if(briefs.length) html += briefsHTML(briefs,label);
  if(all.length > 10 && !query) html += '<div class="more"><button>'+esc(open?T[lang].less:T[lang].more(label))+'</button></div>';
  else html += '<div class="more"></div>';
  body.innerHTML = html;
}
var io=null;
function build(){
  var wrapEl = $('#sections'); wrapEl.innerHTML='';
  if(io) io.disconnect();
  io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting && !en.target.__filled){ en.target.__filled=true; fill(en.target.__sec, en.target); io.unobserve(en.target); } });
  },{rootMargin:'700px 0px'}) : null;
  sections().forEach(function(sec){
    var el=document.createElement('section');
    el.className='cat'; el.id='sec-'+sec.id;
    el.innerHTML='<div class="band"><span>'+esc(T[lang].cats[sec.id])+'</span><span class="n"></span></div><div class="catbody"></div>';
    el.__sec=sec; wrapEl.appendChild(el);
    if(io && !query){ io.observe(el); } else { el.__filled=true; fill(sec,el); }
  });
  var kids=wrapEl.children;
  for(var i=0;i<Math.min(2,kids.length);i++){ if(!kids[i].__filled){ kids[i].__filled=true; fill(kids[i].__sec,kids[i]); if(io) io.unobserve(kids[i]); } }
  buildNav();
}
function refill(){
  Array.prototype.forEach.call($('#sections').children, function(el){ if(el.__filled||query){ el.__filled=true; fill(el.__sec, el); } });
}
function buildNav(){
  var nav=$('#nav'); nav.innerHTML='';
  sections().forEach(function(sec){
    var a=document.createElement('a');
    a.href='#sec-'+sec.id; a.setAttribute('data-id',sec.id); a.textContent=T[lang].cats[sec.id];
    nav.appendChild(a);
  });
}
function drawChips(){
  var box=$('#chips'); box.innerHTML='';
  $('#t-savedhint').textContent = saved.length ? T[lang].savedhint : T[lang].nosaved;
  saved.forEach(function(s,i){
    var c=document.createElement('span'); c.className='chip';
    c.innerHTML='<span title="'+esc(s)+'">'+esc(s)+'</span><b>×</b>';
    c.firstChild.addEventListener('click',function(){ $('#q').value=s; setQuery(s); });
    c.lastChild.addEventListener('click',function(){ saved.splice(i,1); writeLS(LS_SAVED,JSON.stringify(saved)); drawChips(); });
    box.appendChild(c);
  });
}
function setQuery(v){
  query=(v||'').trim();
  var n=$('#notice');
  if(query){
    var count=0;
    sections().forEach(function(sec){ if(!sec.newsletter) count += sec.get().filter(matches).length; });
    $('#noticetext').textContent = T[lang].results(count)+'“'+query+'”';
    n.classList.add('on');
  } else n.classList.remove('on');
  refill();
}
function paint(){
  document.documentElement.lang = lang==='zh'?'zh-Hans':'en';
  $('#tagline').textContent = T[lang].tagline;
  $('#t-saved').textContent = T[lang].saved;
  $('#q').placeholder = T[lang].search;
  $('#saveq').textContent = T[lang].save;
  $('#clearq').textContent = T[lang].clear;
  $('#foot1').textContent = T[lang].foot1;
  $('#foot2').textContent = T[lang].foot2;
  $('#lang-en').setAttribute('aria-pressed', lang==='en');
  $('#lang-zh').setAttribute('aria-pressed', lang==='zh');
  var d=new Date(DATA.meta.fetched_at);
  var stamp = isNaN(d.getTime()) ? DATA.meta.fetched_at : d.toLocaleString(lang==='zh'?'zh-CN':'en-US',{weekday:'long',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#built').textContent = T[lang].built(stamp);
  drawChips();
}
$('#lang-en').addEventListener('click',function(){ if(lang==='en')return; lang='en'; writeLS(LS_LANG,'en'); expanded={}; paint(); build(); setQuery(query); });
$('#lang-zh').addEventListener('click',function(){ if(lang==='zh')return; lang='zh'; writeLS(LS_LANG,'zh'); expanded={}; paint(); build(); setQuery(query); });
$('#q').addEventListener('input',function(){ setQuery(this.value); });
$('#clearq').addEventListener('click',function(){ $('#q').value=''; setQuery(''); });
$('#saveq').addEventListener('click',function(){
  var v=$('#q').value.trim(); if(!v){ $('#q').focus(); return; }
  if(saved.indexOf(v)===-1){ saved.unshift(v); saved=saved.slice(0,12); writeLS(LS_SAVED,JSON.stringify(saved)); drawChips(); }
});
document.addEventListener('click',function(e){
  var tag = e.target.closest ? e.target.closest('.tag') : null;
  if(tag){ e.preventDefault(); e.stopPropagation(); var v=tag.getAttribute('data-tag'); $('#q').value=v; setQuery(v); window.scrollTo({top:0,behavior:'smooth'}); return; }
  var mb = e.target.closest ? e.target.closest('.more button') : null;
  if(mb){ var sec=mb.closest('.cat'); expanded[sec.__sec.id]=!expanded[sec.__sec.id]; fill(sec.__sec,sec); return; }
  var nl = e.target.closest ? e.target.closest('#nav a') : null;
  if(nl){
    e.preventDefault();
    var t=document.getElementById('sec-'+nl.getAttribute('data-id'));
    if(t){ if(!t.__filled){ t.__filled=true; fill(t.__sec,t); } t.scrollIntoView({behavior:'smooth',block:'start'}); }
  }
});
window.addEventListener('scroll',function(){
  var best=null,bd=1e9;
  Array.prototype.forEach.call(document.querySelectorAll('.cat'),function(s){
    var d=Math.abs(s.getBoundingClientRect().top-70); if(d<bd){bd=d;best=s.id.replace('sec-','');}
  });
  Array.prototype.forEach.call(document.querySelectorAll('#nav a'),function(x){ x.classList.toggle('on', x.getAttribute('data-id')===best); });
},{passive:true});

paint(); build();
})();
</script>
</body>
</html>
