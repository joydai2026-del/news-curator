name: M2 post-ship evaluation
on:
  schedule:
    - {cron: '41 6 * * *'}
  workflow_dispatch:
jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/main' && vars.NEWS_CURATOR_M2_EVALUATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: personalization
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Collect sanitized operational evidence
        env:
          NEWS_CURATOR_SUPABASE_URL: ${{ vars.NEWS_CURATOR_SUPABASE_URL }}
          NEWS_CURATOR_SUPABASE_SECRET_KEY: ${{ secrets.NEWS_CURATOR_SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/m2-evaluation"
          python scripts/collect_m2_operational_receipt.py \
            --policy config/m2-evaluation/metrics-policy.yaml \
            --checklist config/m2-evaluation/qa-checklist.yaml \
            --topics topics.yaml \
            --environment production \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/m2-evaluation/operational.json"
      - name: Reduce bound receipts
        id: reduce
        continue-on-error: true
        run: |
          receipts=("$RUNNER_TEMP/m2-evaluation/operational.json")
          while IFS= read -r path; do receipts+=("$path"); done < <(find evaluation/receipts -maxdepth 1 -type f -name '*.json' -print | sort)
          args=()
          for path in "${receipts[@]}"; do args+=(--receipt "$path"); done
          python scripts/evaluate_m2.py \
            --policy config/m2-evaluation/metrics-policy.yaml \
            --checklist config/m2-evaluation/qa-checklist.yaml \
            "${args[@]}" \
            --output "$RUNNER_TEMP/m2-evaluation/result.json"
      - name: Publish sanitized summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'m2-evaluation/result.json'
          if path.exists():
              result=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('## M2 post-ship evaluation\n\n')
                  out.write(f"Status: **{result['status']}**\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m2-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/m2-evaluation
          retention-days: 14
      - name: Enforce evaluation result
        if: always()
        run: test '${{ steps.reduce.outcome }}' = success
