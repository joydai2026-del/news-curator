name: Retained corpus ingest
on:
  schedule:
    - {cron: '*/15 * * * *'}
    - {cron: '5,10,20,25,35,40,50,55 * * * *'}
  workflow_dispatch:
jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/main' && vars.NEWS_CURATOR_RETAINED_CORPUS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: personalization
    concurrency: {group: retained-corpus-ingest, cancel-in-progress: false}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Collect configured source batch
        env:
          FAST_BATCH: ${{ github.event.schedule == '5,10,20,25,35,40,50,55 * * * *' }}
          FAST_SOURCE_TYPES: ${{ vars.NEWS_CURATOR_FAST_SOURCE_TYPES || '["hackernews"]' }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess, sys
          from pathlib import Path
          from curator.config import load_config
          from curator.pipeline import configured_source_specs
          command = [sys.executable, 'scripts/source_snapshot.py', 'collect', '--root', '.', '--snapshot', str(Path(os.environ['RUNNER_TEMP']) / 'source-snapshot.json')]
          if os.environ['FAST_BATCH'] == 'true':
              types = json.loads(os.environ['FAST_SOURCE_TYPES'])
              if not isinstance(types, list) or not types or any(not isinstance(value, str) or not value for value in types):
                  raise SystemExit('fast source types must be a nonempty string list')
              sources = [source for source in configured_source_specs(load_config(Path('.'))) if source.enabled and source.type in types]
              if not sources:
                  raise SystemExit('no enabled configured fast source matches')
              for source in sources:
                  command.extend(['--source-id', source.id])
          subprocess.run(command, check=True)
          PYTHON
      - env:
          NEWS_CURATOR_SUPABASE_URL: ${{ vars.NEWS_CURATOR_SUPABASE_URL }}
          NEWS_CURATOR_SUPABASE_SECRET_KEY: ${{ secrets.NEWS_CURATOR_SUPABASE_SECRET_KEY }}
        run: python scripts/retained_corpus_ingest.py ingest --root . --source-snapshot "$RUNNER_TEMP/source-snapshot.json"
      - name: Translate retained corpus queue
        if: ${{ github.event.schedule != '5,10,20,25,35,40,50,55 * * * *' }}
        env:
          NEWS_CURATOR_SUPABASE_URL: ${{ vars.NEWS_CURATOR_SUPABASE_URL }}
          NEWS_CURATOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEWS_CURATOR_SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/retained_translation_pipeline.py translate --root . --limit 100
