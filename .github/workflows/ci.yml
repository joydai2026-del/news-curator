name: CI

# Deterministic checks only. No network calls, so a flaky feed can never turn a
# pull request red.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate the shipped config
        run: |
          python - <<'PY'
          from pathlib import Path
          from curator.config import load_config

          cfg = load_config(Path("."))
          print(f"{len(cfg.topics)} topics, {len(cfg.rss)} feeds, max age {cfg.max_age_hours}h")
          assert cfg.topics, "topics.yaml parsed to nothing"
          assert cfg.rss, "sources.yaml parsed to no feeds"
          PY

      - name: Render smoke test (offline, no network)
        run: |
          python -m curator.pipeline --root . --out ./site --offline --allow-empty
          python - <<'PY'
          import sys
          from pathlib import Path

          html = Path("site/index.html").read_text(encoding="utf-8")
          for needed in ("<html", "</html>", "News Curator", "scheduled hourly"):
              if needed not in html:
                  sys.exit(f"FAIL: rendered page missing {needed!r}")
          print(f"OK: offline render produced {len(html)} bytes of valid page")
          PY
