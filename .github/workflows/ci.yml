name: CI

# Deterministic checks only. No network calls, so a flaky feed can never turn a
# pull request red.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q curator tests scripts

      - name: Run deterministic tests
        run: python -m pytest -p no:cacheprovider -q -m "not allow_socket"

      - name: Validate the shipped config
        run: |
          python - <<'PY'
          from pathlib import Path
          from curator.config import load_config

          cfg = load_config(Path("."))
          print(f"{len(cfg.categories)} categories, {len(cfg.all_feeds)} feeds "
                f"({len(cfg.rss)} shared), max age {cfg.max_age_hours}h")
          assert cfg.categories, "topics.yaml parsed to nothing"
          assert cfg.rss, "sources.yaml parsed to no shared feeds"
          for c in cfg.categories:
              print(f"  {c.id:<10} {len(c.keywords):>3} keywords, {len(c.sources):>2} curated feeds")
              assert c.keywords or c.sources, f"category {c.id} can never match anything"
          PY

      - name: Render smoke test (offline, no network)
        run: |
          python -m curator.pipeline --root . --out ./site --offline --allow-empty
          python - <<'PY'
          import sys
          from pathlib import Path

          html = Path("site/index.html").read_text(encoding="utf-8")
          for needed in ("<html", "</html>", "News Curator", "scheduled daily"):
              if needed not in html:
                  sys.exit(f"FAIL: rendered page missing {needed!r}")
          print(f"OK: offline render produced {len(html)} bytes of valid page")
          PY

  edge-tests:
    # The edge layer's denial tests, including the positive control that proves
    # they can go red. No dependencies and no build step: Node's built-in runner
    # only, so there is nothing to install.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Edge layer tests
        # Quote the glob. A bare directory is treated as a module entry point on
        # Node 22 and errors out instead of running the suite.
        run: node --test "edge/*.test.js"

      - name: Edge layer tests without ESM auto-detection
        # The SAME suite with Node's ESM auto-detection off. edge/package.json
        # ("type": "module") is what makes these files modules; auto-detection
        # would paper over its absence, so the first step alone stays green with
        # the file deleted (measured: 140/140) while this one collapses to 5
        # tests / 5 failures. Running both means the package file cannot be
        # removed without CI saying so.
        run: node --no-experimental-detect-module --test "edge/*.test.js"

      - name: The edge package manifest exists
        # Belt and braces on the step above: an explicit failure that names the
        # file, rather than a module-resolution error a reader has to decode.
        run: test -f edge/package.json

      - name: Regenerate the committed fixtures
        # Run the maintenance command itself, so a generator that has drifted
        # away from the code (or that crashed, or that writes somewhere else)
        # fails HERE rather than the next time a human runs it. The diff gate
        # below then compares the regenerated bytes against what is committed.
        run: node edge/scripts/regenerate-fixtures.mjs

      - name: Committed fixtures are unchanged by the run
        # The suite READS edge/fixtures and never writes it, and the regeneration
        # above is deterministic, so this should always be clean. It catches two
        # things: a fixture rewritten by any route during the suite, and a
        # generator whose output no longer matches the committed contract
        # evidence. Either way the run must not exit 0.
        run: git diff --exit-code -- edge/fixtures
