name: CI

# Deterministic checks only. No network calls, so a flaky feed can never turn a
# pull request red.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q curator tests scripts

      - name: Run deterministic tests
        run: python -m pytest -p no:cacheprovider -q -m "not allow_socket"

      - name: Validate the shipped config
        run: |
          python - <<'PY'
          from pathlib import Path
          from curator.config import load_config

          cfg = load_config(Path("."))
          print(f"{len(cfg.categories)} categories, {len(cfg.all_feeds)} feeds "
                f"({len(cfg.rss)} shared), max age {cfg.max_age_hours}h")
          assert cfg.categories, "topics.yaml parsed to nothing"
          assert cfg.rss, "sources.yaml parsed to no shared feeds"
          for c in cfg.categories:
              print(f"  {c.id:<10} {len(c.keywords):>3} keywords, {len(c.sources):>2} curated feeds")
              assert c.keywords or c.sources, f"category {c.id} can never match anything"
          PY

      - name: Render smoke test (offline, no network)
        run: |
          python -m curator.pipeline --root . --out ./site --offline --allow-empty
          python - <<'PY'
          import sys
          from pathlib import Path

          html = Path("site/index.html").read_text(encoding="utf-8")
          for needed in ("<html", "</html>", "News Curator", "scheduled hourly"):
              if needed not in html:
                  sys.exit(f"FAIL: rendered page missing {needed!r}")
          print(f"OK: offline render produced {len(html)} bytes of valid page")
          PY
