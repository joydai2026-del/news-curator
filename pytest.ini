[pytest]
testpaths = tests
pythonpath = .
addopts = -q
# Every xfail must be strict: an expected failure that starts passing has to
# FAIL the run, so a marker cannot outlive the bug it names. The CI exemption
# in .github/workflows/ci.yml for the one reader xfail (issue #48) is only
# safe because of this line.
xfail_strict = true
markers =
    allow_socket: test may resolve or connect (host-resolution checks)
