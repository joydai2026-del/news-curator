schema_version: 1
provider: openai
model: gpt-5-mini
endpoint: https://api.openai.com/v1
prompt_revision: m2-rankllm-listwise-r2
maximum_output_tokens: 4096
reasoning_token_allowance: 2048
prompt_framing_token_allowance: 1024
prompt_framing_tokens_per_message: 8
tokenizer_encoding: o200k_base
reasoning_effort: minimal
verbosity: low
deadline_seconds: 6
max_retries: 0
request_cost_limit_usd: 0.02
daily_cost_limit_usd: 2.00
# Standard text pricing verified 2026-09-14:
# https://developers.openai.com/api/docs/models/gpt-5-mini
input_cost_per_million_tokens_usd: 0.25
output_cost_per_million_tokens_usd: 2.0
raw_prompt_logging: false
raw_response_logging: false
invocation_history_persistence: false
reader_origin: null
maximum_request_body_bytes: 32768
candidate_limit: 200
maximum_page_size: 25
maximum_excluded_story_ids: 1000
cursor_ttl_seconds: 900
service_enabled: false
