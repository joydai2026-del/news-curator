schema_version: 1
provider: openai
model: gpt-5-mini
endpoint: https://api.openai.com/v1
prompt_revision: m2-rankllm-predictions-r1
prompt_template: config/rankllm-news-curator-predictions.yaml
# Raised for the five-field prediction payload. The engine sizes its own
# guard from the answer it actually asks for, so this and the schema move
# together instead of the old permutation arithmetic silently rejecting.
maximum_output_tokens: 8192
reasoning_token_allowance: 1024
prompt_framing_token_allowance: 1024
prompt_framing_tokens_per_message: 8
tokenizer_encoding: o200k_base
reasoning_effort: minimal
verbosity: low
# 25, not 6. The transport used to cap itself at six seconds in code, so this
# number changed nothing and every owner reorder came back
# `result_mode: fallback, fallback_reason: provider_deadline` while the provider
# was still thinking. Validated range is up to 60 seconds; raising it means
# raising NEWS_CURATOR_MODAL_FUNCTION_TIMEOUT_SECONDS and
# run.ranking_claim_seconds with it (both checks refuse the boot otherwise).
deadline_seconds: 25
# How long settling an observed cost may take after the provider answers. Named
# here because the reading-run claim window is validated against it at boot.
settle_window_seconds: 5
max_retries: 0
request_cost_limit_usd: 0.02
daily_cost_limit_usd: 2.00
# Standard text pricing verified 2026-09-14:
# https://developers.openai.com/api/docs/models/gpt-5-mini
input_cost_per_million_tokens_usd: 0.25
output_cost_per_million_tokens_usd: 2.0
# How much of one request the model is shown. This is the token bound, and the
# token bound is what a 25-second deadline has to cover: the live owner request
# prepared 50 candidates and 72 history events, about 38,000 input tokens, and
# never finished. Both values are config, so the reading window can be widened
# again without a code change once the measured latency allows it.
prompt:
  # The newest N behavior events reach the prompt. Older ones are dropped before
  # the adapter's cost fitting runs. Range 0 to 200.
  max_history_events: 24
  # The model reorders the first N candidates of the recipe order; the remaining
  # candidates keep the recipe order behind them, with their lanes and labels
  # unchanged. Range 5 to 100, and it is independent of candidate_limit (50),
  # which is still the window the recipe composes and paginates.
  max_model_candidates: 25
raw_prompt_logging: false
raw_response_logging: false
invocation_history_persistence: false
reader_origin: null
maximum_request_body_bytes: 32768
candidate_limit: 50
maximum_page_size: 25
maximum_excluded_story_ids: 1000
# Bounded raw-corpus scans for the language-exclusive view. These are policy,
# not code constants: they trade latency and Supabase calls against how sparse a
# translated corpus can be while still yielding a page.
exclusive_scan_max_batches: 12
exclusive_continuation_max_batches: 2
cursor_ttl_seconds: 3600
service_enabled: true
# M2.1 Phase 1 reading-surface language policy. Mirrors sources.yaml
# `language:` for the request path; exclusivity is stated against this value.
display_language: en
other_lane_enabled: true
exclusive_category_id: only-other-language-press
# Only decisions made by THIS pairing policy are served in the lane.
exclusivity_policy_id: pairing-json-v1
# M2.1 Phase 2 feed recipe. Revision 1 stays on disk as the rollback: pointing
# this at a revision-1-shaped file, or removing the key, returns the feed to the
# newest-`candidate_limit` window without a code change.
composition_policy: config/ranking-policy-r2.yaml
# Client-side budget for ONE Supabase call, in seconds (1 to 30, validated at
# boot). The transport used to hardcode 3.0, and every POST /rank answered 503
# "Supabase request failed" with no way to tell a timeout from a permission
# error.
#
# This value is part of the reading-run claim arithmetic, which
# composition.py Check 10 now enforces:
#
#   run.ranking_claim_seconds
#     > deadline_seconds (25)
#     + settle_window_seconds (5)
#     + (CLAIMED_SECTION_MAX_TRANSPORT_CALLS (23) + one owner-state retry)
#       x timeout_seconds (5) = 120
#     + run.ranking_claim_margin_seconds (10)
#     = 160, so the configured 210 seconds remains conservative.
#
# The container check also includes six pre-claim calls (authentication,
# history, run open, optional run replacement, and view), plus a retry for EACH
# of the two owner-state reads on a continuation: deadline (25) + settle (5)
# + transport ((23 + 6 + 2) x 5) = 185 must be strictly below
# NEWS_CURATOR_MODAL_FUNCTION_TIMEOUT_SECONDS (default 240), or the
# platform kills the request and the reader gets a 500 instead of the typed
# fallback the service already had ready.
#
# Raising this number raises the claim with it, and a longer claim is how long a
# hard-crashed request blocks the reader's feed. 5 is chosen to keep that cost
# bounded: it is above every candidate lane that is not already known-broken,
# and the broken ones are 15s and 102s, which no legal value of this key can
# accommodate. See docs and PR #52: the fix for those is the query, not this.
supabase:
  timeout_seconds: 5
  # Additional timeout attempts per owner-state read, bounded from 0 to 2.
  timeout_retries: 1
