# ============================================================================
# topics.yaml — THIS IS THE FILE YOU EDIT.
#
# Six categories. Each one owns two things:
#
#   keywords  — phrases that pull a matching headline in from ANY feed, so a
#               big story in a general publication reaches the right section.
#   sources   — feeds that are native to this category. A feed listed here is a
#               claim that the publication is SINGLE-SUBJECT: everything it
#               publishes belongs in this section, so its items appear without
#               needing a keyword. That is how "Vogtle 4 enters commercial
#               operation" reaches the energy section, a story that is
#               unmistakably energy news and contains not one energy keyword.
#
# Optional per category:
#   aliases     - extra phrases that also count as a keyword match
#   exclude     - if one of these appears in a headline, drop the item from this
#                 category even if a keyword matched, and even if the feed is
#                 native. Your escape hatch for an ambiguous keyword.
#   id          - a stable short name. Derived from `name` when omitted.
#   hn_queries  - what to ask Hacker News for. See the note at the bottom.
#
# Matching is whole-word and case-insensitive, against the headline only.
# "AI" will not match "malaria" or "said". Multi-word keywords match as a
# phrase.
#
# ---------------------------------------------------------------------------
# ADDING A KEYWORD (the whole procedure)
#
# Find your category below, add a line under `keywords`, save. On GitHub you can
# do this in the browser: the "Add a topic or keyword" link in the page footer
# opens this file in GitHub's editor. Signing in decides who is allowed to save
# it, and the change appears on the site at the next scheduled run.
#
# ---------------------------------------------------------------------------
# ONE THING WORTH KNOWING BEFORE YOU WRITE KEYWORDS
#
# A keyword match proves a phrase APPEARS in a headline. It does not prove the
# story is ABOUT your topic. Those are different claims, and the gap between
# them is where a curated page gets embarrassing.
#
# So prefer specific phrases over generic ones. An early draft of this file
# listed "tool use" as an alias for AI agents, which quietly files carpentry
# and gardening stories under AI. Three rules that avoid most of it:
#
#   1. If a phrase is common outside your topic, do not use it alone. That is
#      why the list below says "quantum computing" and not "quantum", "power
#      grid" and not "grid", "antibody-drug conjugate" and not "ADC" (which is
#      also an analog-to-digital converter).
#   2. If a keyword is also a person's name, a company name, or an everyday
#      word, expect to add a few `exclude` lines. That is normal, not a defect.
#   3. Reach for a native `sources` entry instead when a whole publication is
#      about your topic. It is more accurate than any keyword list, because it
#      is an editorial judgement rather than a string match.
#
# ---------------------------------------------------------------------------
# ABOUT THE FEEDS LISTED HERE
#
# Every feed below returned HTTP 200 with parseable XML when probed on
# 2026-08-28. Reproduce it any time:
#
#     python3 scripts/probe_sources.py
#
# "It returned 200" means the feed is REACHABLE. It does not mean you have
# permission to republish it. Those are different questions and only the first
# is testable by a script. See the note at the top of sources.yaml for which
# outlets are deliberately absent and why.
# ============================================================================

