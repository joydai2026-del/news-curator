      # is worth writing down because both feeds LOOK healthy. They return 200,
      # they parse, they carry 25 entries each. Every one of those entries is
      # then dropped, because their <pubDate> is "Aug 28, 2026 10:30am" rather
      # than RFC 822, so no date parser accepts it and no timezone is stated.
      #
      # We drop undated items rather than stamping them "now", and the same
      # reasoning rules out guessing here: recency is the dominant ranking term,
      # so inventing a timezone would silently misorder the section by hours.
      # If they ever fix the date format, add them back at weight 1.15.
      # - {id: fiercebiotech, name: Fierce Biotech, url: "https://www.fiercebiotech.com/rss/xml", weight: 1.15}
      # - {id: fiercepharma,  name: Fierce Pharma,  url: "https://www.fiercepharma.com/rss/xml",  weight: 1.0}

# ============================================================================
# A NOTE ON `hn_queries`
#
# Keywords are free: they run locally against headlines we already have. Hacker
# News terms are not. Every term costs two API requests, and the run has a hard
# request cap so a slow API can never eat the whole build.
#
# Six categories times thirty keywords would be 360 requests against a cap of
# 60, so most keywords would silently never be searched. `hn_queries` is the
# honest fix: two or three broad terms per category, hand-picked. Hacker News is
# a candidate generator anyway. Whatever it returns is re-checked against the
# full keyword list locally before it can reach the page.
#
# Omit `hn_queries` and the category falls back to using all its keywords, which
# is the v1 behaviour and is fine for a config with one or two categories.
# ============================================================================
